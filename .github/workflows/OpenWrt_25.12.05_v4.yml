name: OpenWrt_25.12.05 TL-WDR4300v4_16mb
on:
  workflow_dispatch:
    inputs:
      hw_version:
        description: '(v4.1)'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      #####################################################################
      ## INSTALL BUILD DEPENDENCIES
      #####################################################################
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev \
            curl rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler \
            u-boot-tools ccache
          echo "========== Compiler versions =========="
          gcc --version | head -n1
          clang --version | head -n1
          ccache --version | head -n1
          echo "======================================="
      #####################################################################
      ## CLONE OPENWRT
      #####################################################################
      - name: Clone OpenWrt 25.12.5 source
        run: |
          git clone --branch v25.12.5 --depth 1 \
            https://github.com/openwrt/openwrt.git
          cd openwrt
          echo "HEAD:     $(git rev-parse HEAD)"
          echo "Describe: $(git describe --always --tags)"
          echo "Log:      $(git log -1 --oneline)"
      #####################################################################
      ## LOCATE FILES
      #####################################################################
      - name: Locate DTS/DTSI files
        run: |
          echo "===== WDR files ====="
          find openwrt/target/linux/ath79/dts \
            \( \
              -iname "*wdr4300*" \
              -o -iname "*wdrxxxx*" \
            \) || true
          echo
          echo "===== Search firmware layout ====="
          grep -RIn "7d0000" \
            openwrt/target/linux/ath79/dts || true
          echo
          echo "===== Search WDR4300 image definitions ====="
          grep -RIn "tplink_tl-wdr4300" \
            openwrt/target/linux/ath79/image || true
      #####################################################################
      ## PATCH IMAGE TYPE
      ## WDR4300 v1: 8MB -> 16MB
      #####################################################################
      - name: Change WDR4300 v1 image type to 16MB
        shell: bash
        run: |
          FILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"
          echo "Using:"
          echo "$FILE"
          echo
          echo "===== WDR4300 v1 BEFORE ====="
          sed -n \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' \
            "$FILE"
          echo
          echo "===== PATCHING WDR4300 v1 ====="
          sed -i \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/ s/\$(Device\/tplink-8mlzma)/\$(Device\/tplink-16mlzma)/' \
            "$FILE"
          echo
          echo "===== WDR4300 v1 AFTER ====="
          sed -n \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' \
            "$FILE"
      #####################################################################
      ## PATCH FLASH LAYOUT
      ## 8MB -> 16MB
      #####################################################################
      - name: Patch flash layout to 16MB
        run: |
          echo "Using WDR4300 DTSI"
          FILE="openwrt/target/linux/ath79/dts/ar9344_tplink_tl-wdrxxxx.dtsi"
          echo
          echo "===== BEFORE ====="
          grep -nE \
            "partition|firmware|art|0x020000|0x7d0000|0x7f0000" \
            "$FILE" || true
          echo
          echo "===== PATCHING FLASH LAYOUT ====="
          sed -i -E \
            's/0x020000[[:space:]]+0x7d0000/0x020000 0xfd0000/' \
            "$FILE"
          sed -i \
            's/partition@7f0000/partition@ff0000/' \
            "$FILE"
          sed -i -E \
            's/0x7f0000[[:space:]]+0x010000/0xff0000 0x010000/' \
            "$FILE"
          echo
          echo "===== AFTER ====="
          grep -nE \
            "partition|firmware|art|0xfd0000|0xff0000" \
            "$FILE" || true
      #####################################################################
      ## DETECT DEVICE PROFILE
      #####################################################################
      - name: Detect device profile name
        run: |
          CANDIDATES=$(
            grep -RhoE \
              "define Device/tplink_tl-wdr4300[a-zA-Z0-9_-]*" \
              openwrt/target/linux/ath79/image \
              | sed 's#define Device/##' \
              | sort -u
          )
          echo "Найдены профили:"
          echo "$CANDIDATES"
          FILTER="${{ github.event.inputs.hw_version }}"
          if [ -n "$FILTER" ]; then
            PROFILE=$(echo "$CANDIDATES" | grep -Fi "$FILTER" | head -n1)
          fi
          if [ -z "$PROFILE" ]; then
            PROFILE=$(echo "$CANDIDATES" \
              | grep -x "tplink_tl-wdr4300-v1" \
              | head -n1)
          fi
          if [ -z "$PROFILE" ]; then
            PROFILE=$(echo "$CANDIDATES" | head -n1)
          fi
          echo
          echo "Выбран профиль:"
          echo "$PROFILE"
          echo "DEVICE_PROFILE=$PROFILE" >> "$GITHUB_ENV"
      #####################################################################
      ## CACHE DL
      #####################################################################
      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-
            openwrt-25.12.5-ath79-
      #####################################################################
      ## CACHE CCACHE
      #####################################################################
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
      #####################################################################
      ## UPDATE FEEDS
      #####################################################################
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      #####################################################################
      ## CONFIGURE BUILD
      #####################################################################
      - name: Configure build
        working-directory: openwrt
        run: |
          echo "Building device:"
          echo "$DEVICE_PROFILE"
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_${DEVICE_PROFILE}=y" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_uhttpd=y" >> .config
          make defconfig
          echo
          echo "========== TARGET =========="
          grep "^CONFIG_TARGET_BOARD=" \
            .config || true
          grep "^CONFIG_TARGET_SUBTARGET=" \
            .config || true
          grep "^CONFIG_TARGET_PROFILE=" \
            .config || true
          grep "^CONFIG_TARGET_ath79_generic_DEVICE_" \
            .config || true
          echo
          echo "========== LuCI =========="
          grep "^CONFIG_PACKAGE_luci=y" \
            .config || true
          grep "^CONFIG_PACKAGE_uhttpd=y" \
            .config || true
      #####################################################################
      ## DOWNLOAD SOURCES
      #####################################################################
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)" V=s
      #####################################################################
      ## BUILD
      #####################################################################
      - name: Build firmware
        working-directory: openwrt
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          make -j"$(nproc)" V=sc || make -j1 V=sc
      #####################################################################
      ## CCACHE STATISTICS
      #####################################################################
      - name: Show ccache statistics
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ccache -s || true
      #####################################################################
      ## COLLECT OUTPUT
      #####################################################################
      - name: Collect output
        run: |
          mkdir -p out
          cp \
            openwrt/bin/targets/ath79/generic/* \
            out/ 2>/dev/null || true
          cp \
            openwrt/.config \
            out/config.txt
          cp \
            openwrt/feeds.conf.default \
            out/
          find out \
            -type f \
            -exec sha256sum {} + \
            > out/sha256sums.txt
          echo
          echo "===== OUTPUT ====="
          ls -lah out
      #####################################################################
      ## UPLOAD
      #####################################################################
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-wdr4300-16M-${{ github.run_number }}
          path: out/
          retention-days: 14

name: OpWRT25_WDR4300_16MB_v2.8.2

on:
  workflow_dispatch:
    inputs:
      confirm_model:
        description: 'Подтверждение: физический роутер TL-WDR4300 v1'
        required: true
        default: 'TL-WDR4300 v1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev \
            curl rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler \
            u-boot-tools ccache

      - name: Verify selected hardware
        run: |
          MODEL="${{ github.event.inputs.confirm_model }}"
          if [ "$MODEL" != "TL-WDR4300 v1" ]; then
            echo "::error::Этот workflow предназначен только для физического TL-WDR4300 v1."
            exit 1
          fi

      - name: Clone OpenWrt 25.12.5
        run: |
          git clone --branch v25.12.5 --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          echo "HEAD:     $(git rev-parse HEAD)"
          echo "Describe: $(git describe --always --tags)"
          echo "Log:      $(git log -1 --oneline)"

      - name: Locate WDR4300 DTS and image definitions
        run: |
          set -e
          echo "===== WDR4300 DTS/DTSI ====="
          find openwrt/target/linux/ath79/dts \
            \( -iname "*wdr4300*" -o -iname "*wdrxxxx*" \) -print
          echo "===== Old firmware layout ====="
          grep -RIn "0x020000.*0x7d0000\|0x7d0000" \
            openwrt/target/linux/ath79/dts || true
          echo "===== Old ART ====="
          grep -RIn "partition@7f0000\|0x7f0000" \
            openwrt/target/linux/ath79/dts || true
          echo "===== WDR4300 v1 image profile ====="
          grep -RIn "define Device/tplink_tl-wdr4300-v1" \
            openwrt/target/linux/ath79/image || true

      - name: Patch WDR4300 v1 image type 8MB -> 16MB
        shell: bash
        run: |
          set -euo pipefail
          FILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"
          test -f "$FILE" || { echo "::error::Не найден $FILE"; exit 1; }
          grep -q '^define Device/tplink_tl-wdr4300-v1$' "$FILE" || {
            echo "::error::В $FILE отсутствует Device/tplink_tl-wdr4300-v1"
            exit 1
          }
          echo "===== BEFORE ====="
          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE"
          sed -i \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/ s/\$(Device\/tplink-8mlzma)/\$(Device\/tplink-16mlzma)/' \
            "$FILE"
          echo "===== AFTER ====="
          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE"
          if ! grep -qE '^[[:space:]]*\$\(Device/tplink-16mlzma\)$' "$FILE"; then
            echo "::error::WDR4300 v1 не переведён на tplink-16mlzma"
            exit 1
          fi

      - name: Patch WDR4300 flash layout to 16MB
        shell: bash
        run: |
          set -euo pipefail
          FILE="openwrt/target/linux/ath79/dts/ar9344_tplink_tl-wdrxxxx.dtsi"
          test -f "$FILE" || { echo "::error::Не найден общий DTSI WDR4300: $FILE"; exit 1; }
          
          echo "===== BEFORE PATCH ====="
          cat "$FILE"
          
          # Проверяем, что файл содержит ожидаемую разметку (с гибким regex)
          if ! grep -qE 'reg[[:space:]]*=[[:space:]]*<0x0*20000[[:space:]]+0x0*7d0000>' "$FILE"; then
            echo "::error::В $FILE не найдена ожидаемая 8MB firmware-разметка."
            echo "::error::Ожидалось: reg = <0x020000 0x7d0000> (с любыми ведущими нулями)"
            exit 1
          fi
          
          if ! grep -qE 'partition@0*7f0000' "$FILE"; then
            echo "::error::В $FILE не найден старый ART partition@7f0000."
            exit 1
          fi
          
          echo "Патчим только WDR4300 shared DTSI: $FILE"
          
          # Патчим firmware partition: 0x7d0000 -> 0xfd0000
          # Используем case-insensitive флаг /I и опциональные ведущие нули
          sed -i -E 's/(reg[[:space:]]*=[[:space:]]*<0x0*20000[[:space:]]+)0x0*7d0000/\10xfd0000/I' "$FILE"
          
          # Патчим ART partition: @7f0000 -> @ff0000
          sed -i -E 's/partition@0*7f0000/partition@ff0000/gI' "$FILE"
          
          # Патчим reg у ART: 0x7f0000 -> 0xff0000
          sed -i -E 's/(reg[[:space:]]*=[[:space:]]*<)0x0*7f0000([[:space:]]+0x0*10000>)/\10xff0000\2/gI' "$FILE"
          
          echo "===== AFTER PATCH ====="
          cat "$FILE"
          
          # Проверяем результат (с гибким regex)
          if ! grep -qE 'reg[[:space:]]*=[[:space:]]*<0x0*20000[[:space:]]+0x0*fd0000>' "$FILE"; then
            echo "::error::Firmware partition не переведён на 16MB."
            exit 1
          fi
          
          if ! grep -qE 'partition@0*ff0000' "$FILE"; then
            echo "::error::ART partition не перемещён в 0xff0000."
            exit 1
          fi
          
          if ! grep -qE 'reg[[:space:]]*=[[:space:]]*<0x0*ff0000[[:space:]]+0x0*10000>' "$FILE"; then
            echo "::error::ART size/offset неверны."
            exit 1
          fi
          
          WDR_DTS="openwrt/target/linux/ath79/dts/ar9344_tplink_tl-wdr4300-v1.dts"
          test -f "$WDR_DTS" || { echo "::error::Не найден DTS TL-WDR4300 v1: $WDR_DTS"; exit 1; }
          grep -q 'ar9344_tplink_tl-wdr4300.dtsi' "$WDR_DTS" || {
            echo "::error::WDR4300 v1 не подключает ожидаемый shared DTSI."
            exit 1
          }
          echo "===== WDR4300 FLASH LAYOUT CHECK: PASS ====="

      - name: Patch IMAGE_SIZE
        shell: bash
        run: |
          set -euo pipefail
          MKFILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"
          test -f "$MKFILE" || { echo "::error::Не найден image Makefile WDR4300: $MKFILE"; exit 1; }
          grep -q '^define Device/tplink_tl-wdr4300-v1$' "$MKFILE" || {
            echo "::error::В $MKFILE отсутствует Device/tplink_tl-wdr4300-v1"
            exit 1
          }
          echo "===== WDR4300 IMAGE DEFINITION BEFORE ====="
          sed -n '/^define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$MKFILE"
          
          awk '
            /^define Device\/tplink_tl-wdr4300-v1$/ { in_wdr=1 }
            in_wdr && /^[[:space:]]*IMAGE_SIZE[[:space:]]*:?=/ { next }
            in_wdr && /^endef$/ {
              print "  IMAGE_SIZE := 16192k"
              in_wdr=0
            }
            { print }
          ' "$MKFILE" > "$MKFILE.tmp"
          mv "$MKFILE.tmp" "$MKFILE"
          
          echo "===== WDR4300 IMAGE DEFINITION AFTER ====="
          sed -n '/^define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$MKFILE"
          
          if ! awk '
            BEGIN { in_wdr=0; found=0 }
            /^define Device\/tplink_tl-wdr4300-v1$/ { in_wdr=1; next }
            in_wdr && /^[[:space:]]*IMAGE_SIZE[[:space:]]*:?=[[:space:]]*16192k[[:space:]]*$/ { found=1 }
            in_wdr && /^endef$/ { exit(found ? 0 : 1) }
            END { if (!in_wdr) exit(found ? 0 : 1) }
          ' "$MKFILE"; then
            echo "::error::IMAGE_SIZE для TL-WDR4300 v1 не установлен в 16192k"
            exit 1
          fi
          echo "===== IMAGE_SIZE CHECK: PASS ====="

      - name: Verify patched image definition
        shell: bash
        run: |
          set -euo pipefail
          FILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"
          awk '
            /^define Device\/tplink_tl-wdr4300-v1$/ { in_wdr=1; print; next }
            in_wdr { print }
            in_wdr && /^endef$/ { exit }
          ' "$FILE"
          awk '
            BEGIN { in_wdr=0; profile=0; size=0 }
            /^define Device\/tplink_tl-wdr4300-v1$/ { in_wdr=1; next }
            in_wdr && /^[[:space:]]*\$\(Device\/tplink-16mlzma\)$/ { profile=1 }
            in_wdr && /^[[:space:]]*IMAGE_SIZE[[:space:]]*:?=[[:space:]]*16192k[[:space:]]*$/ { size=1 }
            in_wdr && /^endef$/ { exit((profile && size) ? 0 : 1) }
            END { if (!in_wdr) exit 1 }
          ' "$FILE"
          echo "Patched WDR4300 image definition: PASS"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12.5-ath79-${{ runner.os }}-dl
          restore-keys: |
            openwrt-25.12.5-ath79-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12.5-ath79-${{ runner.os }}-ccache
          restore-keys: |
            openwrt-25.12.5-ath79-ccache

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            echo "CONFIG_TARGET_ath79=y"
            echo "CONFIG_TARGET_ath79_generic=y"
            echo "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y"
            echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y"
            echo "CONFIG_DEVEL=y"
            echo "CONFIG_CCACHE=y"
            echo "CONFIG_PACKAGE_luci=y"
            echo "CONFIG_PACKAGE_uhttpd=y"
            echo "CONFIG_PACKAGE_luci-ssl=y"
            echo "CONFIG_PACKAGE_luci-i18n-base-ru=y"
            echo "CONFIG_PACKAGE_luci-i18n-package-manager-ru=y"
            echo "CONFIG_PACKAGE_luci-i18n-firewall-ru=y"
            echo "CONFIG_PACKAGE_luci-theme-bootstrap=y"
            echo "CONFIG_PACKAGE_luci-theme-material=y"
            echo "CONFIG_PACKAGE_zoneinfo-asia=y"
            echo "CONFIG_PACKAGE_libustream-openssl=y"
            echo "CONFIG_PACKAGE_kmod-usb-storage=y"
            echo "CONFIG_PACKAGE_kmod-scsi-core=y"
            echo "CONFIG_PACKAGE_kmod-scsi-generic=y"
            echo "CONFIG_PACKAGE_usbutils=y"
            echo "CONFIG_PACKAGE_kmod-fs-ext4=y"
            echo "CONFIG_PACKAGE_kmod-fs-vfat=y"
            echo "CONFIG_PACKAGE_dosfstools=y"
            echo "CONFIG_PACKAGE_kmod-fs-exfat=y"
            echo "CONFIG_PACKAGE_exfatprogs=y"
            echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y"
            echo "CONFIG_PACKAGE_ntfs3-mount=y"
            echo "CONFIG_PACKAGE_block-mount=y"
            echo "CONFIG_PACKAGE_blockd=y"
            echo "CONFIG_PACKAGE_e2fsprogs=y"
            echo "CONFIG_PACKAGE_e2fsprogs-fsck=y"
            echo "CONFIG_PACKAGE_mount-utils=y"
            echo "CONFIG_PACKAGE_tcpdump=y"
            echo "CONFIG_PACKAGE_tshark=y"
            echo "CONFIG_PACKAGE_libpcap=y"
            echo "CONFIG_PACKAGE_bind-tools=y"
            echo "CONFIG_PACKAGE_drill=y"
            echo "CONFIG_PACKAGE_nmap-ssl=y"
            echo "CONFIG_PACKAGE_ca-certificates=y"
            echo "CONFIG_PACKAGE_openssl-util=y"
            echo "CONFIG_PACKAGE_ip-full=y"
            echo "CONFIG_PACKAGE_iproute2=y"
            echo "CONFIG_PACKAGE_kmod-netlink-diag=y"
            echo "CONFIG_PACKAGE_conntrack=y"
            echo "CONFIG_PACKAGE_kmod-nf-conntrack=y"
            echo "CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y"
            echo "CONFIG_PACKAGE_iptables=y"
            echo "CONFIG_PACKAGE_iptables-mod-conntrack=y"
            echo "CONFIG_PACKAGE_mtr=y"
            echo "CONFIG_PACKAGE_iperf3=y"
            echo "CONFIG_PACKAGE_ethtool=y"
            echo "CONFIG_PACKAGE_curl=y"
            echo "CONFIG_PACKAGE_wget-ssl=y"
            echo "CONFIG_PACKAGE_jq=y"
            echo "CONFIG_PACKAGE_openvpn-openssl=y"
            echo "CONFIG_PACKAGE_luci-app-openvpn=y"
            echo "CONFIG_PACKAGE_luci-i18n-openvpn-ru=y"
            echo "CONFIG_PACKAGE_kmod-tun=y"
            echo "CONFIG_PACKAGE_wireguard-tools=y"
            echo "CONFIG_PACKAGE_luci-proto-wireguard=y"
            echo "CONFIG_PACKAGE_kmod-wireguard=y"
            echo "CONFIG_WIREGUARD=y"
            echo "CONFIG_TUN=y"
            echo "CONFIG_PACKAGE_iwinfo=y"
            echo "CONFIG_PACKAGE_iw=y"
            echo "CONFIG_PACKAGE_wireless-tools=y"
            echo "CONFIG_PACKAGE_htop=y"
            echo "CONFIG_PACKAGE_procps-ng=y"
            echo "CONFIG_PACKAGE_lsof=y"
            echo "CONFIG_PACKAGE_file=y"
            echo "CONFIG_PACKAGE_findutils=y"
            echo "CONFIG_PACKAGE_coreutils=y"
            echo "CONFIG_PACKAGE_coreutils-timeout=y"
            echo "CONFIG_PACKAGE_nano=y"
            echo "CONFIG_PACKAGE_vim-full=y"
            echo "CONFIG_PACKAGE_screen=y"
            echo "CONFIG_PACKAGE_tmux=y"
            echo "CONFIG_PACKAGE_logrotate=y"
            echo "CONFIG_PACKAGE_dropbear=y"
            echo "CONFIG_PACKAGE_openssh-client=y"
            echo "CONFIG_PACKAGE_openssh-sftp-client=y"
            echo "CONFIG_PACKAGE_rsync=y"
            echo "CONFIG_PACKAGE_openssh-sftp-server=y"
            echo "CONFIG_PACKAGE_smartmontools=y"
            echo "CONFIG_NETLINK_DIAG=y"
            echo "CONFIG_INET_DIAG=y"
            echo "CONFIG_INET_TCP_DIAG=y"
            echo "CONFIG_INET_UDP_DIAG=y"
          } > .config
          
          make defconfig
          
          echo "===== TARGET ====="
          grep -E "^CONFIG_TARGET_.*(BOARD|SUBTARGET|PROFILE|DEVICE_)" .config || true
          echo "===== RUSSIAN LUCi ====="
          grep "^CONFIG_PACKAGE_luci.*-ru=y" .config || true
          echo "===== VPN ====="
          grep -E "^CONFIG_PACKAGE_(openvpn-openssl|kmod-tun|wireguard-tools|kmod-wireguard|luci-proto-wireguard)=y" .config || true
          echo "===== STORAGE ====="
          grep -E "^CONFIG_PACKAGE_(kmod-usb-storage|kmod-fs-ext4|kmod-fs-vfat|kmod-fs-exfat|kmod-fs-ntfs3|block-mount)=y" .config || true
          
          grep -q "^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y$" .config || {
            echo "::error::После defconfig выбран не TL-WDR4300 v1"
            exit 1
          }
          grep -q "^CONFIG_TARGET_ROOTFS_SQUASHFS=y$" .config || {
            echo "::error::SQUASHFS rootfs не включён."
            exit 1
          }
          grep -q "^CONFIG_PACKAGE_openssh-sftp-server=y$" .config || {
            echo "::error::OpenSSH SFTP server не включён после defconfig."
            exit 1
          }
          if grep -qE '^CONFIG_PACKAGE_python3(-|=)' .config; then
            echo "::error::Python не должен входить в firmware."
            exit 1
          fi
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y: PASS"
          echo "CONFIG_PACKAGE_openssh-sftp-server=y: PASS"

      - name: Prepare ccache
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --zero-stats
          ccache -s

      - name: Download sources and validate downloads
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          make download -j"$(nproc)" V=s
          test -d dl || { echo "::error::Каталог dl не создан после make download."; exit 1; }
          echo "===== DOWNLOAD DIRECTORY ====="
          find dl -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          echo "===== DOWNLOAD CHECK: PASS ====="

      - name: Verify 16MB flash geometry
        shell: bash
        run: |
          set -euo pipefail
          FIRMWARE_OFFSET=$((16#020000))
          FIRMWARE_SIZE=$((16#fd0000))
          ART_OFFSET=$((16#ff0000))
          ART_SIZE=$((16#010000))
          FLASH_END=$((FIRMWARE_OFFSET + FIRMWARE_SIZE))
          test "$FLASH_END" -eq "$ART_OFFSET" || { echo "::error::Firmware и ART не состыкованы."; exit 1; }
          test $((ART_OFFSET + ART_SIZE)) -eq $((16#1000000)) || { echo "::error::ART не заканчивается на конце 16 MiB flash."; exit 1; }
          test "$FIRMWARE_SIZE" -eq 16580608 || { echo "::error::Ожидался размер firmware 16580608 bytes."; exit 1; }
          echo "16MB flash geometry: PASS"

      - name: Verify WDR4300 source files
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          test -f target/linux/ath79/dts/ar9344_tplink_tl-wdr4300-v1.dts
          test -f target/linux/ath79/dts/ar9344_tplink_tl-wdr4300.dtsi
          test -f target/linux/ath79/dts/ar9344_tplink_tl-wdrxxxx.dtsi
          grep -q 'ar9344_tplink_tl-wdr4300.dtsi' target/linux/ath79/dts/ar9344_tplink_tl-wdr4300-v1.dts
          echo "WDR4300 DTS/DTSI source files: PASS"

      - name: Verify final OpenWrt image profile
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          echo "===== EFFECTIVE IMAGE PROFILE ====="
          awk '
            /^define Device\/tplink_tl-wdr4300-v1$/ { in_wdr=1 }
            in_wdr { print }
            in_wdr && /^endef$/ { exit }
          ' target/linux/ath79/image/generic-tp-link.mk
          
          awk '
            BEGIN { in_wdr=0; profile=0; size=0; end=0 }
            /^define Device\/tplink_tl-wdr4300-v1$/ { in_wdr=1; next }
            in_wdr && /^[[:space:]]*\$\(Device\/tplink-16mlzma\)$/ { profile=1 }
            in_wdr && /^[[:space:]]*IMAGE_SIZE[[:space:]]*:?=[[:space:]]*16192k[[:space:]]*$/ { size=1 }
            in_wdr && /^endef$/ { end=1; exit }
            END { if (!(in_wdr && end && profile && size)) exit 1 }
          ' target/linux/ath79/image/generic-tp-link.mk
          echo "Final WDR4300 image profile: PASS"

      - name: Build firmware
        working-directory: openwrt
        env:
          CCACHE_DIR: /home/runner/.ccache
        shell: bash
        run: |
          set -o pipefail
          if ! make -j"$(nproc)" V=sc; then
            echo "::warning::Параллельная сборка завершилась ошибкой, повторяем однопоточно."
            make -j1 V=sc
          fi
          echo "===== BUILD ARTIFACTS AFTER MAKE ====="
          find bin/targets/ath79/generic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Show ccache statistics
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ccache -s || true

      - name: Verify final DTB and partition layout
        shell: bash
        run: |
          set -euo pipefail
          echo "===== SEARCH DTB ====="
          DTB=$(find openwrt/build_dir openwrt/bin -type f -iname "ar9344_tplink_tl-wdr4300-v1.dtb" -print -quit 2>/dev/null || true)
          if [ -z "$DTB" ]; then
            DTB=$(find openwrt/build_dir openwrt/bin -type f -iname "*wdr4300*.dtb" -print -quit 2>/dev/null || true)
          fi
          if [ -z "$DTB" ]; then
            echo "::error::Итоговый DTB WDR4300 не найден."
            exit 1
          fi
          echo "DTB: $DTB"
          
          DTS=$(mktemp)
          if [ -n "$DTS" ]; then
            trap 'rm -f "$DTS"' EXIT
          fi
          dtc -I dtb -O dts "$DTB" > "$DTS"
          
          echo "===== PARTITIONS ====="
          grep -A5 -B1 "partition@" "$DTS"
          
          # Гибкая проверка firmware
          if ! grep -qE 'partition@0*20000' "$DTS"; then
            echo "::error::Firmware partition@20000 не найден."
            exit 1
          fi
          if ! grep -qE 'reg[[:space:]]*=[[:space:]]*<0x0*20000[[:space:]]+0x0*fd0000>' "$DTS"; then
            echo "::error::Firmware reg не равен <0x20000 0xfd0000>."
            exit 1
          fi
          
          # Гибкая проверка ART
          if ! grep -qE 'partition@0*ff0000' "$DTS"; then
            echo "::error::ART partition@ff0000 не найден."
            exit 1
          fi
          if ! grep -qE 'reg[[:space:]]*=[[:space:]]*<0x0*ff0000[[:space:]]+0x0*10000>' "$DTS"; then
            echo "::error::ART reg не равен <0xff0000 0x10000>."
            exit 1
          fi
          echo "===== DTB LAYOUT CHECK: PASS ====="

      - name: Verify firmware image size
        shell: bash
        run: |
          set -euo pipefail
          DIR="openwrt/bin/targets/ath79/generic"
          LIMIT=16580608
          test -d "$DIR" || { echo "::error::Каталог firmware не найден: $DIR"; exit 1; }
          
          echo "===== ALL TARGET IMAGES ====="
          find "$DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          
          echo "===== FLASHABLE FIRMWARE IMAGES ====="
          find "$DIR" -maxdepth 1 -type f \
            \( -iname "*wdr4300*v1*factory*.bin" -o -iname "*wdr4300*v1*sysupgrade*.bin" \) \
            -printf '%f %s bytes\n' | sort || true
          
          FACTORY="$DIR/openwrt-ath79-generic-tplink_tl-wdr4300-v1-squashfs-factory.bin"
          SYSUPGRADE="$DIR/openwrt-ath79-generic-tplink_tl-wdr4300-v1-squashfs-sysupgrade.bin"
          
          for IMG in "$FACTORY" "$SYSUPGRADE"; do
            if [ ! -f "$IMG" ]; then
              echo "::error::Ожидаемый flashable image не найден: $IMG"
              echo "===== EFFECTIVE ROOTFS CONFIG ====="
              grep -E '^CONFIG_TARGET_ROOTFS_' openwrt/.config || true
              echo "===== DEVICE CONFIG ====="
              grep -E '^CONFIG_TARGET_ath79_generic_DEVICE_' openwrt/.config || true
              echo "===== TARGET DIRECTORY ====="
              ls -lah "$DIR" || true
              exit 1
            fi
          done
          
          for IMG in "$FACTORY" "$SYSUPGRADE"; do
            SIZE=$(stat -c%s "$IMG")
            echo "$IMG -> $SIZE bytes"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$IMG больше максимально допустимого размера firmware partition ($LIMIT bytes)"
              echo "::error::Требуется уменьшить набор пакетов."
              exit 1
            fi
          done
          echo "Factory image: PASS"
          echo "Sysupgrade image: PASS"
          echo "===== IMAGE SIZE CHECK: PASS ====="

      - name: Verify required files and package configuration
        working-directory: openwrt
        run: |
          set -e
          echo "===== REQUIRED CONFIG ====="
          REQUIRED=(
            "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y"
            "CONFIG_TARGET_ROOTFS_SQUASHFS=y"
            "CONFIG_PACKAGE_luci=y"
            "CONFIG_PACKAGE_luci-i18n-base-ru=y"
            "CONFIG_PACKAGE_luci-i18n-firewall-ru=y"
            "CONFIG_PACKAGE_openvpn-openssl=y"
            "CONFIG_PACKAGE_kmod-tun=y"
            "CONFIG_PACKAGE_wireguard-tools=y"
            "CONFIG_PACKAGE_kmod-wireguard=y"
            "CONFIG_PACKAGE_tcpdump=y"
            "CONFIG_PACKAGE_tshark=y"
            "CONFIG_PACKAGE_openssh-sftp-server=y"
            "CONFIG_PACKAGE_kmod-usb-storage=y"
            "CONFIG_PACKAGE_kmod-fs-ext4=y"
            "CONFIG_PACKAGE_block-mount=y"
          )
          for item in "${REQUIRED[@]}"; do
            grep -qx "$item" .config || {
              echo "::error::Отсутствует обязательная настройка: $item"
              exit 1
            }
          done
          echo "===== REQUIRED CONFIG CHECK: PASS ====="
          
          test -f target/linux/ath79/image/generic-tp-link.mk
          grep -q '^define Device/tplink_tl-wdr4300-v1$' target/linux/ath79/image/generic-tp-link.mk
          
          # Гибкая проверка TARGET_DEVICES (может быть = или +=)
          if ! grep -qE '^TARGET_DEVICES[[:space:]]*[+:]?=[[:space:]]*.*tplink_tl-wdr4300-v1' target/linux/ath79/image/generic-tp-link.mk; then
            echo "::error::TARGET_DEVICES не содержит tplink_tl-wdr4300-v1"
            exit 1
          fi
          echo "WDR4300 target declaration: PASS"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          if [ -d openwrt/bin/targets/ath79/generic ]; then
            cp -a openwrt/bin/targets/ath79/generic/. out/
          else
            echo "::error::Каталог target artifacts не найден."
            exit 1
          fi
          cp openwrt/.config out/config.txt
          cp openwrt/feeds.conf.default out/ 2>/dev/null || true
          
          {
            echo "OpenWrt 25.12.5"
            echo "Target: ath79/generic"
            echo "Device: TL-WDR4300 v1"
            echo "Flash: 16 MB (firmware partition 16192 KiB)"
            echo "Firmware partition: 0x020000 + 0xfd0000 (16192 KiB)"
            echo "ART partition: 0xff0000 + 0x010000"
            echo "LuCI language: Russian"
            echo "Python in firmware: no (install later on USB/extroot)"
            echo "Build: v2.6"
            echo
            echo "Git HEAD:"
            (cd openwrt && git rev-parse HEAD)
          } > out/BUILD_INFO.txt
          
          test -n "$(find out -type f -print -quit)" || { echo "::error::Каталог out пуст."; exit 1; }
          find out -type f ! -name sha256sums.txt -exec sha256sum {} + > out/sha256sums.txt
          echo "===== OUTPUT ====="
          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpWRT25_WDR4300_16MB_v2.8.2-${{ github.run_number }}
          path: out/
          retention-days: 30
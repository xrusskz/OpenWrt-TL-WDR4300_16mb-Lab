name: OpenWrt_25.12.05 TL-WDR4300v1_16mb

on:
  workflow_dispatch:
    inputs:
      hw_version:
        description: '(v1)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev \
            curl rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler \
            u-boot-tools ccache

          echo "========== Compiler versions =========="
          gcc --version | head -n1
          clang --version | head -n1
          ccache --version | head -n1
          echo "======================================="

      - name: Clone OpenWrt 25.12.5 source
        run: |
          git clone --branch v25.12.5 --depth 1 https://github.com/openwrt/openwrt.git

          cd openwrt

          echo "HEAD:     $(git rev-parse HEAD)"
          echo "Describe: $(git describe --always --tags)"
          echo "Log:      $(git log -1 --oneline)"

      - name: Locate DTS/DTSI files
        run: |

          echo "===== WDR files ====="

          find openwrt/target/linux/ath79/dts \
            \( \
            -iname "*wdr4300*" \
            -o -iname "*wdr3600*" \
            -o -iname "*wdrxxxx*" \
            \)

          echo
          echo "===== Search old ART partition ====="

          grep -RIn "partition@7f0000" \
            openwrt/target/linux/ath79/dts || true

          echo
          echo "===== Search image definitions ====="

          grep -RIn "tplink_tl-wdr4300" \
            openwrt/target/linux/ath79/image || true

      ####################################################################
      ## PATCH FLASH LAYOUT
      ####################################################################

      - name: Patch flash layout to 16MB
        run: |

          echo "Searching correct DTS/DTSI..."

          FILE=""

          for F in \
            $(find openwrt/target/linux/ath79/dts \
              \( \
                -iname "*wdr4300*" \
                -o -iname "*wdr3600*" \
                -o -iname "*wdrxxxx*" \
              \)); do

              if grep -q "0x020000 0x7d0000" "$F"; then
                  FILE="$F"
                  break
              fi

          done

          if [ -z "$FILE" ]; then

              echo "::error::Не найден DTS/DTSI с firmware-разделом 0x7d0000"

              echo
              echo "Кандидаты:"
              find openwrt/target/linux/ath79/dts \
                \( \
                  -iname "*wdr4300*" \
                  -o -iname "*wdr3600*" \
                  -o -iname "*wdrxxxx*" \
                \)

              exit 1

          fi

          echo
          echo "Используется:"
          echo "$FILE"

          echo
          echo "===== BEFORE ====="

          grep -nE \
            "partition@7f0000|0x020000|0x7f0000" \
            "$FILE"

          grep -q "0x020000 0x7d0000" "$FILE" \
            || {
                echo "::error::Исходная разметка неожиданная."
                exit 1
            }

          sed -i \
            's/reg = <0x020000 0x7d0000>;/reg = <0x020000 0xfd0000>;/' \
            "$FILE"

          sed -i \
            's/partition@7f0000/partition@ff0000/' \
            "$FILE"

          sed -i \
            's/reg = <0x7f0000 0x010000>;/reg = <0xff0000 0x010000>;/' \
            "$FILE"

          echo
          echo "===== AFTER ====="

          grep -nE \
            "partition@ff0000|0xfd0000|0xff0000" \
            "$FILE"

      - name: Detect device profile name
        run: |

          CANDIDATES=$(
            grep -RhoE "define Device/tplink_tl-wdr4300[a-zA-Z0-9_-]*" \
              openwrt/target/linux/ath79/image \
              | sed 's#define Device/##' \
              | sort -u
          )

          echo "Найдены профили:"
          echo "$CANDIDATES"

          if [ -z "$CANDIDATES" ]; then
              echo "::error::Не найден профиль TL-WDR4300"
              exit 1
          fi

          FILTER="${{ github.event.inputs.hw_version }}"

          if [ -n "$FILTER" ]; then
              PROFILE=$(echo "$CANDIDATES" | grep -i "$FILTER" | head -n1)
          fi

          if [ -z "$PROFILE" ]; then

              PROFILE=$(echo "$CANDIDATES" | grep -x "tplink_tl-wdr4300" | head -n1)

              [ -z "$PROFILE" ] &&
                  PROFILE=$(echo "$CANDIDATES" | grep -x "tplink_tl-wdr4300-v1" | head -n1)

              [ -z "$PROFILE" ] &&
                  PROFILE=$(echo "$CANDIDATES" | head -n1)

          fi

          echo "Выбран профиль:"
          echo "$PROFILE"

          echo "DEVICE_PROFILE=$PROFILE" >> "$GITHUB_ENV"

      ####################################################################
      ## CACHE
      ####################################################################
      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache

      ####################################################################
      ## FEEDS
      ####################################################################

      - name: Update feeds
        working-directory: openwrt
        run: |

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      ####################################################################
      ## CONFIG
      ####################################################################

      - name: Configure build
        working-directory: openwrt
        run: |
          test -n "$DEVICE_PROFILE" || {
            echo "::error::DEVICE_PROFILE пуст"
            exit 1
          }

          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_${DEVICE_PROFILE}=y" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_uhttpd=y" >> .config

          make defconfig

          echo
          echo "========== TARGET =========="

          grep "^CONFIG_TARGET_BOARD=" .config || true
          grep "^CONFIG_TARGET_SUBTARGET=" .config || true
          grep "^CONFIG_TARGET_PROFILE=" .config || true
          grep "^CONFIG_TARGET_MULTI_PROFILE=" .config || true
          grep "^CONFIG_TARGET_ath79_generic_DEVICE_" .config || true

          echo
          echo "========== LuCI =========="

          grep "^CONFIG_PACKAGE_luci=y" .config || true
          grep "^CONFIG_PACKAGE_uhttpd=y" .config || true

          echo
          echo "========== CCACHE =========="

          grep "^CONFIG_CCACHE=y" .config || true

          grep -q "CONFIG_TARGET_ath79_generic_DEVICE_${DEVICE_PROFILE}=y" .config || {
              echo "::error::Профиль устройства исчез после defconfig"
              exit 1
          }

      ####################################################################
      ## DOWNLOAD
      ####################################################################

      - name: Download sources
        working-directory: openwrt
        run: |

          make download -j"$(nproc)" V=s

          BAD=$(find dl -type f -size -1024c)

          if [ -n "$BAD" ]; then
              echo "::error::Обнаружены поврежденные архивы"
              echo "$BAD"
              exit 1
          fi

      ####################################################################
      ## BUILD
      ####################################################################

      - name: Build firmware
        working-directory: openwrt
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |

          make -j"$(nproc)" V=sc || make -j1 V=sc

      - name: Show ccache statistics
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |

          ccache -s || true

      ####################################################################
      ## VERIFY DTB
      ####################################################################

      - name: Verify patched layout
        run: |

          echo "===== Searching WDR4300 DTB ====="

          DTB=$(
            find openwrt/build_dir openwrt/bin \
              -type f \
              \( -iname "*.dtb" -o -iname "*.dtb.o" \) \
              2>/dev/null \
            | grep -i "$DEVICE_PROFILE" \
            | head -n1
          )

          if [ -z "$DTB" ]; then

              DTB=$(
                find openwrt/build_dir openwrt/bin \
                  -type f \
                  \( -iname "*.dtb" -o -iname "*.dtb.o" \) \
                  2>/dev/null \
                | grep -i "tplink" \
                | grep -i "4300" \
                | head -n1
              )

          fi

          if [ -n "$DTB" ]; then

              echo "Found:"
              echo "$DTB"

              DTS=$(mktemp)

              trap 'rm -f "$DTS"' EXIT

              dtc -I dtb -O dts "$DTB" > "$DTS"

              echo
              echo "===== Partitions ====="

              grep -A4 -B1 "partition@" "$DTS"

              grep -q "0xfd0000" "$DTS" || {
                  echo "::error::Firmware partition was not patched."
                  exit 1
              }

              grep -q "0xff0000" "$DTS" || {
                  echo "::error::ART partition was not patched."
                  exit 1
              }

          else

              echo "::warning::Standalone DTB not found."

          fi

      ####################################################################
      ## SIZE CHECK
      ####################################################################

      - name: Verify image size
        run: |
              grep -q "0xff0000" "$DTS" || {

                  echo "::error::ART partition was not patched."

                  exit 1

              }

          else

              echo "::warning::Standalone DTB not found."

          fi

      ####################################################################
      ## SIZE CHECK
      ####################################################################

      - name: Verify image size
        run: |

          echo "===== Firmware ====="

          ls -lh openwrt/bin/targets/ath79/generic/*.bin || true

          LIMIT=16580608

          FAILED=0

          while read IMG; do

              [ -z "$IMG" ] && continue

              SIZE=$(stat -c%s "$IMG")

              echo
              echo "$IMG"
              echo "$SIZE bytes"

              if [ "$SIZE" -gt "$LIMIT" ]; then

                  echo "::error::Image is larger than firmware partition."

                  FAILED=1

              fi

          done < <(

              find openwrt/bin/targets/ath79/generic \
                -maxdepth 1 \
                \( \
                  -iname "*factory*.bin" \
                  -o \
                  -iname "*sysupgrade*.bin" \
                \)

          )

          [ "$FAILED" -eq 0 ] || exit 1

      ####################################################################
      ## COLLECT
      ####################################################################

      - name: Collect output
        run: |

          mkdir -p out

          cp \
            openwrt/bin/targets/ath79/generic/* \
            out/ 2>/dev/null || true

          cp openwrt/.config out/config.txt

          cp openwrt/feeds.conf.default out/

          sha256sum out/* \
            > out/sha256sums.txt

          echo

          echo "===== OUTPUT ====="

          ls -lah out

      ####################################################################
      ## UPLOAD
      ####################################################################

      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: openwrt-25.12.5-wdr4300-16M-${{ github.run_number }}

          path: out/

          retention-days: 14

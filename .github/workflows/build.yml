name: Build OpenWrt 16M for TL-WDR4300

# Запускается вручную кнопкой "Run workflow" во вкладке Actions вашего репозитория
on:
  workflow_dispatch:
    inputs:
      hw_version:
        description: 'Ревизия роутера (v1, v2 и т.д.) — как в имени device profile'
        required: true
        default: 'v1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt 25.12.5 source
        run: |
          git clone --branch v25.12.5 --depth 1 https://github.com/openwrt/openwrt.git

      # --- Патч разметки флеша: firmware-раздел увеличивается на 8 МБ (0x800000),
      # art-раздел сдвигается в конец. Правим общий для wdr3600/4300 dtsi-файл.
      - name: Patch flash partition layout to 16M
        run: |
          FILE=openwrt/target/linux/ath79/dts/ar9344_tplink_tl-wdrxxxx.dtsi
          echo "--- до патча ---"
          grep -n "reg = <0x020000\|reg = <0x7f0000\|partition@7f0000" "$FILE"
          sed -i 's/reg = <0x020000 0x7d0000>;/reg = <0x020000 0xfd0000>;/' "$FILE"
          sed -i 's/partition@7f0000/partition@ff0000/' "$FILE"
          sed -i 's/reg = <0x7f0000 0x010000>;/reg = <0xff0000 0x010000>;/' "$FILE"
          echo "--- после патча ---"
          grep -n "reg = <0x020000\|reg = <0xff0000\|partition@ff0000" "$FILE"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (ath79 / tl-wdr4300)
        working-directory: openwrt
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-${{ github.event.inputs.hw_version }}=y
          EOF
          make defconfig

      - name: Build firmware
        working-directory: openwrt
        run: make -j$(nproc) V=s

      - name: Collect output images
        run: |
          mkdir -p out
          find openwrt/bin/targets/ath79/generic -iname "*tl-wdr4300*" -exec cp {} out/ \;
          ls -la out

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-wdr4300-16M
          path: out/
          retention-days: 14

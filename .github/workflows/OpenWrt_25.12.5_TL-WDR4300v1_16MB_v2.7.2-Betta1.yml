name: OpenWrt_25.12.5_TL-WDR4300v1_16MB_v2.7.2-Betta1

on:
  workflow_dispatch:
    inputs:
      confirm_model:
        description: "Подтверждение: физический роутер TL-WDR4300 v1"
        required: true
        default: "TL-WDR4300 v1"
      include_tshark:
        description: "Добавить TShark (очень сильно увеличивает образ)"
        required: true
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev \
            curl rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler \
            u-boot-tools ccache

      - name: Verify selected hardware
        run: |
          set -euo pipefail
          MODEL="${{ github.event.inputs.confirm_model }}"
          if [ "$MODEL" != "TL-WDR4300 v1" ]; then
            echo "::error::Этот workflow предназначен только для физического TL-WDR4300 v1."
            exit 1
          fi

      - name: Clone OpenWrt 25.12.5
        run: |
          set -euo pipefail
          git clone --branch v25.12.5 --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          HEAD="$(git rev-parse HEAD)"
          echo "HEAD:     $HEAD"
          echo "Describe: $(git describe --always --tags)"
          echo "Log:      $(git log -1 --oneline)"
          case "$HEAD" in
            f0a60ee*) ;;
            *) echo "::error::Получен не OpenWrt v25.12.5 commit f0a60ee."; exit 1 ;;
          esac

      - name: Locate exact WDR4300 DTS and image definitions
        run: |
          set -euo pipefail
          DTS_DIR="openwrt/target/linux/ath79/dts"
          IMG_DIR="openwrt/target/linux/ath79/image"

          test -d "$DTS_DIR"
          test -d "$IMG_DIR"

          echo "===== WDR4300 DTS/DTSI CANDIDATES ====="
          find "$DTS_DIR" -type f \
            \( -iname "*wdr4300*" -o -iname "*wdrxxxx*" \) -print | sort

          echo "===== WDR4300 DEVICE PROFILE ====="
          grep -RIn "define Device/tplink_tl-wdr4300-v1" "$IMG_DIR" || {
            echo "::error::Профиль tplink_tl-wdr4300-v1 не найден."
            exit 1
          }

      - name: Patch WDR4300 v1 image type 8MB -> 16MB
        shell: bash
        run: |
          set -euo pipefail
          FILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"

          test -f "$FILE" || {
            echo "::error::Не найден $FILE"
            exit 1
          }

          echo "===== BEFORE ====="
          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE"

          PROFILE_BEFORE="$(sed -n '/^define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE")"
          printf '%s\n' "$PROFILE_BEFORE" | grep -Fq '$(Device/tplink-8mlzma)' || {
            echo "::error::Upstream v25.12.5 WDR4300 profile не соответствует ожидаемому tplink-8mlzma; patch остановлен."
            exit 1
          }

          sed -i \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/ s/\$(Device\/tplink-8mlzma)/\$(Device\/tplink-16mlzma)/' \
            "$FILE"

          echo "===== AFTER ====="
          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE"

          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE" |
            grep -q '\$(Device/tplink-16mlzma)' || {
              echo "::error::WDR4300 v1 не переведён на tplink-16mlzma."
              exit 1
            }

      - name: Patch exact WDR4300 flash layout to 16MB
        shell: bash
        run: |
          set -euo pipefail

          DTS_DIR="openwrt/target/linux/ath79/dts"
          FILE=""

          test -f "$DTS_DIR/ar9344_tplink_tl-wdr4300-v1.dts" || {
            echo "::error::В v25.12.5 отсутствует ожидаемый ar9344_tplink_tl-wdr4300-v1.dts."
            exit 1
          }
           test -f "$DTS_DIR/ar9344_tplink_tl-wdrxxxx.dtsi" || {
             echo "::error::В v25.12.5 отсутствует ожидаемый ar9344_tplink_tl-wdrxxxx.dtsi."
            exit 1
          }

          # ВАЖНО:
          # Ищем старую разметку только в DTS/DTSI, относящихся к WDR4300/WDRxxxx.
          # Больше нельзя брать первый произвольный TP-Link DTS.
          while IFS= read -r -d '' candidate; do
            if grep -qE '0x020000[[:space:]]+0x7d0000' "$candidate" &&
               grep -qE 'partition@7f0000|0x7f0000[[:space:]]+0x010000' "$candidate"; then
              FILE="$candidate"
              break
            fi
          done < <(
            find "$DTS_DIR" -type f \
              \( -iname "*wdr4300*" -o -iname "*wdrxxxx*" \) \
              -print0
          )

          if [ -z "$FILE" ]; then
            echo "::error::Не найден DTS/DTSI WDR4300/WDRxxxx со старой 8MB разметкой."
            echo "===== DTS FILES ====="
            find "$DTS_DIR" -type f -print | sort
            exit 1
          fi

          echo "Patching exact WDR4300 layout file: $FILE"

          sed -i -E \
            -e 's/0x020000[[:space:]]+0x7d0000/0x020000 0xfd0000/' \
            -e 's/partition@7f0000/partition@ff0000/g' \
            -e 's/0x7f0000[[:space:]]+0x010000/0xff0000 0x010000/' \
            "$FILE"

          echo "===== PATCHED WDR4300 PARTITIONS ====="
          grep -nE \
            'partition@|firmware|art|0x020000|0x7d0000|0xfd0000|0x7f0000|0xff0000|0x010000' \
            "$FILE" || true

          ! grep -qE '0x020000[[:space:]]+0x7d0000' "$FILE" || {
            echo "::error::Старая firmware-разметка 8MB всё ещё присутствует."
            exit 1
          }

          ! grep -qE '0x7f0000[[:space:]]+0x010000' "$FILE" || {
            echo "::error::Старая ART-разметка 8MB всё ещё присутствует."
            exit 1
          }

          grep -qE '0x020000[[:space:]]+0xfd0000' "$FILE" || {
            echo "::error::Firmware не переведён на 0x020000 + 0xfd0000."
            exit 1
          }

          grep -q 'partition@ff0000' "$FILE" || {
            echo "::error::ART partition не перемещён в 0xff0000."
            exit 1
          }

          grep -qE '0xff0000[[:space:]]+0x010000' "$FILE" || {
            echo "::error::ART не имеет reg 0xff0000 + 0x010000."
            exit 1
          }

      - name: Patch IMAGE_SIZE for 16MB firmware
        shell: bash
        run: |
          set -euo pipefail

          MKFILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"
          test -f "$MKFILE" || {
            echo "::error::Не найден $MKFILE"
            exit 1
          }

          # IMAGE_SIZE относится только к конкретному WDR4300 v1 profile.
          BEFORE="$(sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$MKFILE")"
          echo "===== WDR4300 IMAGE PROFILE BEFORE ====="
          echo "$BEFORE"

          # В профиле Device размер берётся из tplink-16mlzma.
          # Дополнительная глобальная замена IMAGE_SIZE не выполняется:
          # это могло бы повредить другие TP-Link profiles.

          grep -q '\$(Device/tplink-16mlzma)' <<<"$BEFORE" || {
            echo "::error::WDR4300 v1 не использует tplink-16mlzma."
            exit 1
          }

          echo "===== 16MB IMAGE PROFILE ====="
          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$MKFILE"

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-
            openwrt-25.12.5-ath79-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache

      - name: Update feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_DEVEL=y
          CONFIG_CCACHE=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-i18n-package-manager-ru=y
          CONFIG_PACKAGE_luci-i18n-firewall-ru=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_zoneinfo-asia=y
          CONFIG_PACKAGE_libustream-openssl=y

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_kmod-scsi-generic=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_dosfstools=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_exfatprogs=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_blockd=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_e2fsprogs-fsck=y
          CONFIG_PACKAGE_mount-utils=y

          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_libpcap=y
          CONFIG_PACKAGE_bind-tools=y
          CONFIG_PACKAGE_drill=y
          CONFIG_PACKAGE_nmap-ssl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_openssl-util=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iproute2=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_conntrack=y
          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
          CONFIG_PACKAGE_mtr=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_jq=y

          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-i18n-openvpn-ru=y
          CONFIG_PACKAGE_kmod-tun=y

          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_kmod-wireguard=y

          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_wireless-tools=y

          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_procps-ng=y
          CONFIG_PACKAGE_lsof=y
          CONFIG_PACKAGE_file=y
          CONFIG_PACKAGE_findutils=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-timeout=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_vim-full=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_tmux=y
          CONFIG_PACKAGE_logrotate=y

          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_openssh-client=y
          CONFIG_PACKAGE_openssh-sftp-client=y
          CONFIG_PACKAGE_rsync=y
          CONFIG_PACKAGE_smartmontools=y

          CONFIG_NETLINK_DIAG=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_TCP_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          EOF

          if [ "${{ github.event.inputs.include_tshark }}" = "true" ]; then
            echo 'CONFIG_PACKAGE_tshark=y' >> .config
          fi

          make defconfig
          make prereq

          echo "===== TARGET ====="
          grep -E '^CONFIG_TARGET_.*(BOARD|SUBTARGET|PROFILE|DEVICE_)' .config || true

          grep -q '^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y$' .config || {
            echo "::error::После defconfig выбран не TL-WDR4300 v1."
            exit 1
          }

          echo "===== RUSSIAN LUCI ====="
          grep '^CONFIG_PACKAGE_luci.*-ru=y' .config || true

          echo "===== VPN ====="
          grep -E '^CONFIG_PACKAGE_(openvpn-openssl|kmod-tun|wireguard-tools|kmod-wireguard|luci-proto-wireguard)=y' .config || true

          echo "===== STORAGE ====="
          grep -E '^CONFIG_PACKAGE_(kmod-usb-storage|kmod-fs-ext4|kmod-fs-vfat|kmod-fs-exfat|kmod-fs-ntfs3|block-mount)=y' .config || true

          make download -j"$(nproc)"

      - name: Prepare ccache
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=5G
          ccache --zero-stats
          ccache -s

      - name: Download sources and validate archives
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)" V=s
          BAD="$(find dl -type f -size -1024c -print)"
          if [ -n "$BAD" ]; then
            echo "::error::Обнаружены подозрительно маленькие/повреждённые архивы:"
            echo "$BAD"
            exit 1
          fi

      - name: Build firmware
        working-directory: openwrt
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=sc || make -j1 V=sc

      - name: Ensure target images are generated
        working-directory: openwrt
        run: |
          set -euo pipefail
          DIR="bin/targets/ath79/generic"
          if find "$DIR" -maxdepth 1 -type f \
              \( -iname '*wdr4300-v1*-squashfs-factory.bin' -o -iname '*wdr4300-v1*-squashfs-sysupgrade.bin' \) \
              -print -quit | grep -q .; then
            echo "Target image(s) already present."
          else
            echo "No WDR4300 squashfs image found after main build; running explicit image target."
            make target/install V=sc
          fi
          echo "===== TARGET BINARIES AFTER IMAGE GENERATION ====="
          find "$DIR" -maxdepth 1 -type f -name '*.bin' -printf '%f %s bytes\n' | sort || true

      - name: Show ccache statistics
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ccache -s || true

      - name: Verify final DTB and exact partition layout
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="openwrt/build_dir"
          BIN_DIR="openwrt/bin"
          DTS_DIR="openwrt/target/linux/ath79/dts"

          test -d "$BUILD_DIR" || {
            echo "::error::openwrt/build_dir не найден."
            exit 1
          }
          test -d "$BIN_DIR" || {
            echo "::error::openwrt/bin не найден."
            exit 1
          }

          echo "===== SEARCH EXACT WDR4300 DTB ====="

          mapfile -d '' DTB_CANDIDATES < <(
            find "$BUILD_DIR" "$BIN_DIR" -type f \
              \( -iname "*wdr4300*.dtb" -o -iname "*wdr4300*.dtb.o" \) \
              -print0
          )

          if [ "${#DTB_CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::DTB TL-WDR4300 не найден."
            find "$BUILD_DIR" "$BIN_DIR" -type f \
              \( -iname "*.dtb" -o -iname "*.dtb.o" \) -print | sort
            exit 1
          fi

          DTB=""
          for candidate in "${DTB_CANDIDATES[@]}"; do
            echo "Candidate: $candidate"

            TEST_DTS="$(mktemp)"
            if dtc -I dtb -O dts "$candidate" > "$TEST_DTS" 2>/dev/null; then
              if grep -Eq \
                'tplink,tl-wdr4300-v1|TL-WDR4300 v1|TL-WDR4300' \
                "$TEST_DTS"; then
                DTB="$candidate"
                cp "$TEST_DTS" /tmp/final-wdr4300.dts
                rm -f "$TEST_DTS"
                break
              fi
            fi
            rm -f "$TEST_DTS"
          done

          if [ -z "$DTB" ]; then
            echo "::error::Не найден DTB с compatible/model TL-WDR4300 v1."
            echo "Найденные DTB:"
            printf '%s\n' "${DTB_CANDIDATES[@]}"
            exit 1
          fi

          DTS="/tmp/final-wdr4300.dts"

          echo "===== SELECTED DTB ====="
          echo "$DTB"

          echo "===== MODEL / COMPATIBLE ====="
          grep -E 'model =|compatible =' "$DTS" | head -30 || true

          grep -Eq \
            'tplink,tl-wdr4300-v1|TL-WDR4300 v1|TL-WDR4300' \
            "$DTS" || {
              echo "::error::Выбранный DTB не идентифицирован как TL-WDR4300."
              exit 1
            }

          echo "===== PARTITIONS ====="
          awk '
            /partition@/ {show=1}
            show {print}
            show && /^[[:space:]]*};/ {show=0}
          ' "$DTS"

          # Exact WDR4300 16MB map.
          grep -Eq 'partition@0*20000([[:space:]]|\{|$)' "$DTS" || {
            echo "::error::Firmware partition@20000 не найден."
            exit 1
          }

          grep -Eq 'reg = <0x0*20000 0x0*fd0000>' "$DTS" || {
            echo "::error::Firmware reg не равен <0x20000 0xfd0000>."
            exit 1
          }

          grep -Eq 'partition@0*ff0000([[:space:]]|\{|$)' "$DTS" || {
            echo "::error::ART partition@ff0000 не найден."
            exit 1
          }

          grep -Eq 'reg = <0x0*ff0000 0x0*10000>' "$DTS" || {
            echo "::error::ART reg не равен <0xff0000 0x10000>."
            exit 1
          }

          # Mathematical boundary checks.
          FW_START=$((0x020000))
          FW_SIZE=$((0xfd0000))
          FW_END=$((FW_START + FW_SIZE))
          ART_START=$((0xff0000))
          ART_SIZE=$((0x010000))
          ART_END=$((ART_START + ART_SIZE))
          FLASH_SIZE=$((0x1000000))

          echo "===== NUMERIC LAYOUT ====="
          printf 'Firmware: start=0x%06x size=0x%06x end=0x%06x\n' \
            "$FW_START" "$FW_SIZE" "$FW_END"
          printf 'ART:      start=0x%06x size=0x%06x end=0x%06x\n' \
            "$ART_START" "$ART_SIZE" "$ART_END"
          printf 'Flash:    size =0x%07x (%d bytes / 16 MiB)\n' \
            "$FLASH_SIZE" "$FLASH_SIZE"

          [ "$FW_END" -eq "$ART_START" ] || {
            echo "::error::Firmware не заканчивается на начале ART."
            exit 1
          }

          [ "$ART_END" -eq "$FLASH_SIZE" ] || {
            echo "::error::ART не заканчивается на конце 16MiB flash."
            exit 1
          }

          [ "$FW_START" -eq $((0x020000)) ] || exit 1
          [ "$FW_SIZE" -eq $((0xfd0000)) ] || exit 1
          [ "$ART_START" -eq $((0xff0000)) ] || exit 1
          [ "$ART_SIZE" -eq $((0x010000)) ] || exit 1

          echo "===== DTB LAYOUT CHECK: PASS ====="

      - name: Verify final package manifest and image metadata
        working-directory: openwrt
        run: |
          set -euo pipefail
          TARGET_DIR="bin/targets/ath79/generic"
          test -d "$TARGET_DIR"
          test -f "$TARGET_DIR/sha256sums"
          grep -q 'tplink_tl-wdr4300-v1' "$TARGET_DIR/sha256sums" || {
            echo "::error::sha256sums не содержит TL-WDR4300 v1 image."
            exit 1
          }
          echo "===== TARGET MANIFEST ====="
          grep 'tplink_tl-wdr4300-v1' "$TARGET_DIR/sha256sums"

      - name: Verify firmware image size
        shell: bash
        run: |
          set -euo pipefail

          DIR="openwrt/bin/targets/ath79/generic"
          LIMIT=$((0xfd0000))
          MAX_IMAGE_SIZE=$((0xfd0000))

          test -d "$DIR" || {
            echo "::error::Каталог firmware не найден: $DIR"
            exit 1
          }

          echo "===== FIRMWARE IMAGES ====="
          find "$DIR" -maxdepth 1 -type f \
            \( -iname "*factory*.bin" -o -iname "*sysupgrade*.bin" \) \
            -exec ls -lh {} + || true

          mapfile -t FACTORY_CANDIDATES < <(find "$DIR" -maxdepth 1 -type f \
            \( -iname '*tplink_tl-wdr4300-v1*-squashfs-factory.bin' \
               -o -iname '*tl-wdr4300-v1*-squashfs-factory.bin' \) -print | sort)
          mapfile -t SYSUPGRADE_CANDIDATES < <(find "$DIR" -maxdepth 1 -type f \
            \( -iname '*tplink_tl-wdr4300-v1*-squashfs-sysupgrade.bin' \
               -o -iname '*tl-wdr4300-v1*-squashfs-sysupgrade.bin' \) -print | sort)

          echo "Factory candidates: ${#FACTORY_CANDIDATES[@]}"
          printf '%s\n' "${FACTORY_CANDIDATES[@]}"
          echo "Sysupgrade candidates: ${#SYSUPGRADE_CANDIDATES[@]}"
          printf '%s\n' "${SYSUPGRADE_CANDIDATES[@]}"

          if [ "${#FACTORY_CANDIDATES[@]}" -eq 0 ] || [ "${#SYSUPGRADE_CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::Ожидаемые WDR4300 squashfs images не созданы."
            echo "===== ALL TARGET BINARIES ====="
            find "$DIR" -maxdepth 1 -type f -name '*.bin' -printf '%f\n' | sort || true
            echo "===== IMAGE CONFIG ====="
            grep -E '^(CONFIG_TARGET_ROOTFS_|CONFIG_TARGET_|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_kmod-fs)' openwrt/.config 2>/dev/null | sort || true
            echo "===== IMAGE BUILD METADATA ====="
            find "$DIR" -maxdepth 1 -type f \
              \( -name 'profiles.json' -o -name 'sha256sums' -o -name 'version.buildinfo' -o -name 'config.buildinfo' \) \
              -print -exec sh -c 'echo "--- $1"; sed -n "1,80p" "$1"' _ {} \; || true
            exit 1
          fi

          FACTORY="${FACTORY_CANDIDATES[0]}"
          SYSUPGRADE="${SYSUPGRADE_CANDIDATES[0]}"

          COUNT=0
          while IFS= read -r IMG; do
            [ -z "$IMG" ] && continue
            COUNT=$((COUNT + 1))
            SIZE=$(stat -c%s "$IMG")
            echo "$IMG -> $SIZE bytes"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$IMG больше firmware partition 0xfd0000 ($LIMIT bytes)."
              exit 1
            fi
            if [ "$SIZE" -gt "$MAX_IMAGE_SIZE" ]; then
              echo "::error::$IMG больше штатного IMAGE_SIZE tplink-16mlzma (0xfd0000)."
              exit 1
            fi
          done < <(printf '%s\n%s\n' "$FACTORY" "$SYSUPGRADE")

          [ "$COUNT" -eq 2 ] || {
            echo "::error::Ожидались оба стандартных образа: factory и sysupgrade."
            exit 1
          }

          while IFS= read -r IMG; do
            case "$(basename "$IMG")" in
              *tplink_tl-wdr4300-v1*-squashfs-*.bin) ;;
              *) echo "::error::Образ не соответствует TL-WDR4300 v1: $IMG"; exit 1 ;;
            esac
          done < <(find "$DIR" -maxdepth 1 -type f \
              \( -iname "*factory*.bin" -o -iname "*sysupgrade*.bin" \) -print)

          echo "Verified firmware partition limit: ${LIMIT} bytes (0xfd0000)."
          echo "===== IMAGE SIZE CHECK: PASS ====="

      - name: Verify required files and package configuration
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "===== REQUIRED CONFIG ====="

          REQUIRED=(
            "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y"
            "CONFIG_PACKAGE_luci=y"
            "CONFIG_PACKAGE_luci-i18n-base-ru=y"
            "CONFIG_PACKAGE_luci-i18n-firewall-ru=y"
            "CONFIG_PACKAGE_luci-app-package-manager=y"
            "CONFIG_PACKAGE_luci-i18n-package-manager-ru=y"
            "CONFIG_PACKAGE_openvpn-openssl=y"
            "CONFIG_PACKAGE_kmod-tun=y"
            "CONFIG_PACKAGE_wireguard-tools=y"
            "CONFIG_PACKAGE_kmod-wireguard=y"
            "CONFIG_PACKAGE_tcpdump=y"
            "CONFIG_PACKAGE_kmod-usb-storage=y"
            "CONFIG_PACKAGE_kmod-fs-ext4=y"
            "CONFIG_PACKAGE_block-mount=y"
            "CONFIG_PACKAGE_kmod-fs-ntfs3=y"
          )

          for item in "${REQUIRED[@]}"; do
            grep -qx "$item" .config || {
              echo "::error::Отсутствует обязательная настройка: $item"
              exit 1
            }
          done

          if [ "${{ github.event.inputs.include_tshark }}" = "true" ]; then
            grep -qx 'CONFIG_PACKAGE_tshark=y' .config || { echo "::error::TShark не выбран после defconfig."; exit 1; }
          fi

          echo "===== PYTHON EXCLUSION CHECK ====="
          if grep -Eq '^CONFIG_PACKAGE_python3(=y|$)|^CONFIG_PACKAGE_python3-pip(=y|$)|^CONFIG_PACKAGE_python3-asyncio(=y|$)|^CONFIG_PACKAGE_python3-json(=y|$)' .config; then
            echo "::error::Python3/python3-pip/python3-asyncio/python3-json обнаружены в firmware .config."
            grep -E '^CONFIG_PACKAGE_python3(=y|$)|^CONFIG_PACKAGE_python3-pip(=y|$)|^CONFIG_PACKAGE_python3-asyncio(=y|$)|^CONFIG_PACKAGE_python3-json(=y|$)' .config || true
            exit 1
          fi
          echo "Python packages excluded from firmware: PASS"

          echo "===== REQUIRED CONFIG CHECK: PASS ====="

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          find openwrt/bin/targets/ath79/generic -maxdepth 1 -type f \
            -exec cp -t out -- {} +

          test -f openwrt/.config || {
            echo "::error::openwrt/.config не найден."
            exit 1
          }
          cp openwrt/.config out/config.txt

          if [ -f openwrt/feeds.conf.default ]; then
            cp openwrt/feeds.conf.default out/
          fi

          if ! find out -maxdepth 1 -type f \
              \( -iname "*factory*.bin" -o -iname "*sysupgrade*.bin" \) \
              -print -quit | grep -q .; then
            echo "::error::В out не скопирован ни один factory/sysupgrade BIN."
            exit 1
          fi

          {
            echo "OpenWrt 25.12.5"
            echo "Target: ath79/generic"
            echo "Device: TL-WDR4300 v1"
            echo "Flash: 16 MB"
            echo "Firmware partition: 0x020000 + 0xfd0000"
            echo "Firmware end: 0xff0000"
            echo "ART partition: 0xff0000 + 0x010000"
            echo "Flash end: 0x1000000"
            echo "LuCI language: Russian"
            echo "Build: v2.7.2-Betta1"
            echo
            echo "DTB verification: strict TL-WDR4300 model/compatible"
            echo "DTB verification: firmware partition@20000"
            echo "DTB verification: ART partition@ff0000"
            echo "DTB verification: numeric 16MiB boundary"
            echo
            echo "Git HEAD:"
            (cd openwrt && git rev-parse HEAD)
          } > out/BUILD_INFO.txt

          find out -type f ! -name 'sha256sums.txt' \
            -exec sha256sum {} + > out/sha256sums.txt

          echo "===== OUTPUT ====="
          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_25.12.5_TL-WDR4300v1_16MB_v2.7.2-Betta1-${{ github.run_number }}
          path: out/
          retention-days: 30

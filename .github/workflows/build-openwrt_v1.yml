name: Build OpenWrt 16M for TL-WDR4300 v1

# Запускается вручную кнопкой "Run workflow" во вкладке Actions вашего репозитория
on:
  workflow_dispatch:
    inputs:
      hw_version:
        description: 'Необязательный фильтр по ревизии (v1, v2, il...) — если несколько профилей подходят, оставьте пустым для автовыбора первого найденного'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3 python3-setuptools python3-dev curl \
            rsync swig unzip zlib1g-dev file wget device-tree-compiler u-boot-tools ccache
          echo "========== Compiler versions =========="
          gcc --version | head -n1
          clang --version | head -n1
          ccache --version | head -n1
          echo "========================================="

      - name: Clone OpenWrt 25.12.5 source
        run: |
          git clone --branch v25.12.5 --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          # отдельная проверка через describe/exact-match не нужна: git clone --branch v25.12.5
          # сам завершится с ошибкой, если такого тега не существует. Просто фиксируем
          # в логе, на каком именно коммите оказались, для воспроизводимости.
          echo "HEAD:     $(git rev-parse HEAD)"
          echo "Describe: $(git describe --always --tags)"
          echo "Log:      $(git log -1 --oneline)"

      - name: Locate DTS/DTSI files for the device
        run: |
          echo "Файлы, относящиеся к wdr4300, в дереве ath79/dts:"
          find openwrt/target/linux/ath79/dts \( -iname "*wdr4300*" -o -iname "*wdrxxxx*" \)
          echo ""
          echo "Где именно в дереве встречается partition@7f0000 (на случай, если структура сместилась в другой файл):"
          grep -RIn "partition@7f0000" openwrt/target/linux/ath79/dts || echo "не найдено ни в одном файле — офсеты в 25.12.5 отличаются, патч ниже придётся адаптировать вручную"
          echo ""
          echo "Проверяем image-makefile'ы ath79 на упоминания устройства и любые захардкоженные лимиты размера прошивки —"
          echo "это отдельный источник проблем: DTB может говорить '16M', а image builder всё ещё резать образ под 8M."
          echo "--- упоминания tplink_tl-wdr4300 в target/linux/ath79/image ---"
          grep -RIn "tplink_tl-wdr4300" openwrt/target/linux/ath79/image || echo "не найдено"
          echo "--- IMAGE_SIZE ---"
          grep -RIn "IMAGE_SIZE" openwrt/target/linux/ath79/image || echo "не найдено"
          echo "--- KERNEL_SIZE ---"
          grep -RIn "KERNEL_SIZE" openwrt/target/linux/ath79/image || echo "не найдено"
          echo "--- KERNEL_INITRAMFS ---"
          grep -RIn "KERNEL_INITRAMFS" openwrt/target/linux/ath79/image || echo "не найдено"
          echo "--- FLASHLAYOUT / TPLINK_FLASHLAYOUT ---"
          grep -RIn "FLASHLAYOUT" openwrt/target/linux/ath79/image || echo "не найдено"
          echo "--- BLOCKSIZE ---"
          grep -RIn "BLOCKSIZE" openwrt/target/linux/ath79/image || echo "не найдено"
          echo "--- IMAGE/factory.bin и IMAGE/sysupgrade.bin ---"
          grep -RIn "IMAGE/factory.bin\|IMAGE/sysupgrade.bin" openwrt/target/linux/ath79/image || echo "не найдено"
          echo ""
          echo "Если что-то из этого нашлось и совпадает по смыслу с размером флеша (8M/7808k/0x7d0000 и т.п.) —"
          echo "этот .mk тоже придётся патчить отдельно, DTS-патча одного будет недостаточно."
          echo ""
          echo "--- точное имя device-профиля для wdr4300 ---"
          grep -RInE 'define Device/|DEVICE_MODEL|DEVICE_VARIANT' openwrt/target/linux/ath79/image | grep -i "WDR4300" || echo "не нашёл ни одного упоминания WDR4300 рядом с определением профиля — проверьте вручную перед запуском make defconfig"

      # --- Патч разметки флеша: firmware-раздел увеличивается на 8 МБ (0x800000),
      # art-раздел сдвигается в конец. Правим общий для wdr3600/4300 dtsi-файл.
      - name: Patch flash partition layout to 16M
  run: |
    set -e
    echo "========== Поиск файлов WDR =========="
    find openwrt/target/linux/ath79/dts \
      \( -iname "*wdr4300*" -o -iname "*wdr3600*" -o -iname "*wdrxxxx*" \) \
      | sort || true
    echo ""
    echo "========== Поиск DTS по compatible =========="
    DTS=$(grep -RIlE 'compatible *=.*(tl-wdr4300|tl-wdr3600)' \
          openwrt/target/linux/ath79/dts || true)
    if [ -z "$DTS" ]; then
        echo "::error::Не найден DTS для TL-WDR4300/TL-WDR3600"
        exit 1
    fi
    echo "$DTS"
    DTS=$(echo "$DTS" | head -n1)
    echo ""
    echo "Используется DTS:"
    echo "$DTS"
    echo ""
    echo "========== include =========="
    INC=$(grep '^#include' "$DTS" \
          | sed -n 's/^#include "\(.*\)"/\1/p' \
          | head -n1)
    if [ -n "$INC" ] && [ -f "openwrt/target/linux/ath79/dts/$INC" ]; then
        FILE="openwrt/target/linux/ath79/dts/$INC"
        echo "Будет патчиться общий DTSI:"
        echo "$FILE"
    else
        FILE="$DTS"
        echo "Патчим сам DTS:"
        echo "$FILE"
    fi
    echo ""
    echo "========== Проверяем разметку =========="
    grep -nE 'partition@|reg =' "$FILE"
    grep -q 'reg = <0x020000 0x7d0000>;' "$FILE" || {
        echo "::error::Не найден firmware 0x7d0000"
        exit 1
    }
    grep -q 'partition@7f0000' "$FILE" || {
        echo "::error::Не найден ART"
        exit 1
    }
    echo ""
    echo "========== Патчим =========="
    sed -i \
      's/reg = <0x020000 0x7d0000>;/reg = <0x020000 0xfd0000>;/' \
      "$FILE"
    sed -i \
      's/partition@7f0000/partition@ff0000/' \
      "$FILE"
    sed -i \
      's/reg = <0x7f0000 0x010000>;/reg = <0xff0000 0x010000>;/' \
      "$FILE"
    echo ""
    echo "========== Проверяем =========="
    grep -q '0xfd0000' "$FILE"
    grep -q 'partition@ff0000' "$FILE"
    grep -q '0xff0000 0x010000' "$FILE"
    echo "OK"
    echo ""
    echo "========== git diff =========="
    git -C openwrt diff --stat -- "${FILE#openwrt/}"
    git -C openwrt diff -- "${FILE#openwrt/}"
    echo "================================="

      - name: Detect device profile name
        run: |
          # Не доверяем пользователю угадать точное имя профиля (tplink_tl-wdr4300-v1,
          # tplink_tl-wdr4300, tplink_tl-wdr4300-v1_il — вариантов реально несколько
          # в истории OpenWrt). Извлекаем список кандидатов прямо из исходников.
          CANDIDATES=$(grep -RhoE "define Device/tplink_tl-wdr4300[a-zA-Z0-9_-]*" \
            openwrt/target/linux/ath79/image | sed 's#define Device/##' | sort -u)

          echo "Найденные профили устройства:"
          echo "$CANDIDATES"

          if [ -z "$CANDIDATES" ]; then
            echo "::error::не нашёл ни одного профиля tplink_tl-wdr4300* в target/linux/ath79/image — структура 25.12.5 отличается, нужно адаптировать вручную"
            exit 1
          fi

          FILTER="${{ github.event.inputs.hw_version }}"
          if [ -n "$FILTER" ]; then
            PROFILE=$(echo "$CANDIDATES" | grep -i -- "$FILTER" | head -n1)
            if [ -z "$PROFILE" ]; then
              echo "::warning::фильтр '$FILTER' не совпал ни с одним найденным профилем, выбираю по приоритету по умолчанию"
            fi
          fi

          if [ -z "$PROFILE" ]; then
            # без явного фильтра выбор всегда одинаковый и не зависит от порядка
            # в исходниках/сортировки: сначала имя без суффикса ревизии, потом -v1,
            # и только затем — первое, что вообще нашлось
            PROFILE=$(echo "$CANDIDATES" | grep -x "tplink_tl-wdr4300" | head -n1)
            [ -z "$PROFILE" ] && PROFILE=$(echo "$CANDIDATES" | grep -x "tplink_tl-wdr4300-v1" | head -n1)
            [ -z "$PROFILE" ] && PROFILE=$(echo "$CANDIDATES" | head -n1)

            COUNT=$(echo "$CANDIDATES" | wc -l)
            if [ "$COUNT" -gt 1 ]; then
              echo "::warning::найдено несколько подходящих профилей, по приоритету выбран: $PROFILE. Если нужен другой — перезапустите workflow, указав hw_version (например v2 или il)"
            fi
          fi

          echo "Выбран профиль: $PROFILE"
          echo "DEVICE_PROFILE=$PROFILE" >> "$GITHUB_ENV"

      - name: Cache dl/
        uses: actions/cache@v4
        with:
          # staging_dir/host сознательно не кэшируем: там лежат хост-инструменты
          # сборки, и если между запусками поменяются зависимости/тулчейн, кэш
          # может тихо подсунуть несовместимые бинарники. dl/ — просто скачанные
          # архивы исходников, кэшировать безопасно.
          path: openwrt/dl
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          # ccache безопасен для кэширования между запусками (в отличие от staging_dir/host):
          # это content-addressed кэш объектных файлов, а не хост-инструменты, так что
          # устаревание кэша просто ведёт к промаху (cache miss), а не к тихой поломке сборки
          path: ~/.ccache
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (ath79 / tl-wdr4300)
        working-directory: openwrt
        run: |
          # DEVICE_PROFILE попадает сюда через $GITHUB_ENV из шага "Detect device
          # profile name" — это официально поддерживаемый механизм GitHub Actions
          # (переменные из $GITHUB_ENV автоматически становятся env для всех
          # последующих шагов, без явного env: в каждом из них), так что полагаться
          # на него безопасно. Но на всякий случай явно проверяем, что переменная
          # не пуста, прежде чем подставлять её в .config — так пустая строка не
          # проскочит незаметно как "CONFIG_TARGET_..._DEVICE_=y"
          test -n "$DEVICE_PROFILE" \
            || { echo "::error::DEVICE_PROFILE пуст — шаг 'Detect device profile name', похоже, не отработал"; exit 1; }
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_${DEVICE_PROFILE}=y" >> .config
          # CCACHE=1 в качестве переменной make в OpenWrt buildroot ничего не включает —
          # ccache реально задействуется только через CONFIG_CCACHE=y, а он появляется
          # в Config.in только при включённом CONFIG_DEVEL=y
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          # без этого прошивка соберётся вообще без веб-интерфейса — только SSH/консоль.
          # luci — метапакет, обычно сам тянет зависимости, но uhttpd (веб-сервер,
          # без которого LuCI открываться не будет) добавляю явно, для надёжности
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_uhttpd=y" >> .config
          make defconfig
          echo ""
          echo "========== TARGET (после defconfig) =========="
          grep "^CONFIG_TARGET_BOARD=" .config || echo "CONFIG_TARGET_BOARD не найден"
          grep "^CONFIG_TARGET_SUBTARGET=" .config || echo "CONFIG_TARGET_SUBTARGET не найден"
          grep "^CONFIG_TARGET_PROFILE=" .config || echo "CONFIG_TARGET_PROFILE не найден"
          grep "^CONFIG_TARGET_MULTI_PROFILE=" .config || echo "CONFIG_TARGET_MULTI_PROFILE не найден (нормально, если профиль не multi)"
          grep "^CONFIG_TARGET_ath79_generic_DEVICE_" .config || echo "CONFIG_TARGET_ath79_generic_DEVICE_* не найден"
          echo "--- пакеты, которые профиль устройства добавляет по умолчанию (чисто справочно) ---"
          grep "^CONFIG_TARGET_DEVICE_PACKAGES=" .config || echo "CONFIG_TARGET_DEVICE_PACKAGES не найден"
          echo "================================================"
          echo "--- luci/uhttpd-пакеты, реально попавшие в .config ---"
          grep -q "^CONFIG_PACKAGE_luci=y" .config \
            && echo "LuCI OK" \
            || echo "::warning::CONFIG_PACKAGE_luci=y не найден в .config — метапакет LuCI не выбран"
          grep -q "^CONFIG_PACKAGE_uhttpd=y" .config \
            && echo "uhttpd OK" \
            || echo "::warning::CONFIG_PACKAGE_uhttpd=y не найден в .config — без веб-сервера LuCI открываться не будет, даже если сам пакет luci выбран"
          # проверяем, что defconfig реально выбрал наше устройство, а не проигнорировал строку молча
          grep -q "CONFIG_TARGET_ath79_generic_DEVICE_${DEVICE_PROFILE}=y" .config \
            || { echo "::error::профиль устройства $DEVICE_PROFILE не найден после defconfig — проверьте вывод шага 'Detect device profile name' выше"; exit 1; }
          grep -q "^CONFIG_CCACHE=y" .config \
            || echo "::warning::CONFIG_CCACHE не попал в итоговый .config (возможно, эта опция скрыта в 25.12.5 за другим Kconfig-условием) — ccache не будет использоваться, сборка просто станет медленнее, на результат не влияет"

      - name: Check device-specific size limits in image makefile
        run: |
          # Ранняя диагностика в шаге "Locate DTS/DTSI files" грепает IMAGE_SIZE/FLASHLAYOUT
          # по ВСЕМУ target/linux/ath79/image — там сотни других устройств, и почти
          # любой grep там что-нибудь найдёт, так что делать это жёсткой проверкой было
          # бы гарантированным false positive. Здесь же вырезаем ТОЛЬКО блок
          # define Device/$DEVICE_PROFILE ... endef — то есть определение именно
          # нашего устройства — и ищем зафиксированные под старые 8М лимиты уже в нём.
          # Это достаточно узко, чтобы можно было позволить себе жёсткий exit 1.
          : > /tmp/device_block.txt
          for f in openwrt/target/linux/ath79/image/*.mk; do
            sed -n "/define Device\\/${DEVICE_PROFILE}\$/,/endef/p" "$f" >> /tmp/device_block.txt
          done

          if [ ! -s /tmp/device_block.txt ]; then
            echo "::warning::блок define Device/${DEVICE_PROFILE} не нашёлся ни в одном .mk-файле (устройство, возможно, определено через общий include/шаблон) — точечная проверка размера пропущена, полагайтесь на вывод шага 'Locate DTS/DTSI files' выше"
          else
            echo "--- найденный блок определения устройства ---"
            cat /tmp/device_block.txt
            echo "----------------------------------------------"
            if grep -qE "7808k|7936k|0x7d0000|IMAGE_SIZE|KERNEL_SIZE" /tmp/device_block.txt; then
              echo "::error::в определении устройства ${DEVICE_PROFILE} найден захардкоженный лимит размера (см. блок выше) — DTS-патча одного недостаточно, image builder всё ещё режет образ под старый размер флеша. Нужно поправить и этот .mk"
              exit 1
            else
              echo "OK: явных лимитов размера в блоке устройства не найдено"
            fi
          fi

      - name: Download sources
        working-directory: openwrt
        run: |
          # заранее наполняем dl/ до компиляции: ошибки скачивания (недоступный
          # мирror, битый тарбол) видно отдельно от ошибок сборки, и кэш dl/
          # для следующего запуска получается полнее
          # V=s: make download в OpenWrt может завершиться "успешно" даже если часть
          # архивов не скачалась — подробный лог сразу показывает URL и причину ошибки
          make download -j$(nproc) V=s

          # make download в OpenWrt иногда завершается кодом 0, даже если часть
          # архивов не докачалась (fallback-зеркало вернуло html-страницу с ошибкой
          # вместо тарбола и т.п.) — проверяем явно, нет ли подозрительно маленьких файлов
          BAD=$(find dl -type f -size -1024c 2>/dev/null)
          if [ -n "$BAD" ]; then
            echo "::error::похожие на повреждённые/неполные архивы в dl/ (меньше 1КБ):"
            echo "$BAD"
            exit 1
          fi

      - name: Build firmware
        working-directory: openwrt
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -o pipefail
          # обнуляем статистику ccache перед сборкой — иначе "Show ccache statistics"
          # ниже показывал бы накопленные цифры со всех прошлых запусков, использовавших
          # тот же восстановленный кэш, а не только текущего
          ccache -z || true
          # ccache уже включён через CONFIG_CCACHE=y в .config (см. предыдущий шаг) —
          # никакой make-переменной CCACHE=1 здесь не нужно, buildroot сам подхватит
          # ccache для всех компиляторов, раз опция стоит в конфиге
          #
          # весь вывод сохраняется в build.log — если прошивка потом не взлетит на
          # реальном железе, можно будет посмотреть, чем именно она собиралась.
          # set -o pipefail обязателен: без него код возврата всей строки — это код
          # tee (почти всегда 0), а не make, и упавшая сборка молча показала бы "успех"
          make -j"$(nproc)" V=sc 2>&1 | tee build.log || make -j1 V=sc 2>&1 | tee -a build.log

      - name: Show ccache statistics
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          echo "========== CCACHE =========="
          ccache -s || true
          echo "============================="

      - name: Verify patched layout made it into the build
        run: |
          # грепать промежуточные .dts в build_dir ненадёжно — часть файлов
          # генерируется/удаляется по ходу сборки.
          echo "Все .dtb/.dtb.o в build_dir/bin (для справки, полный список):"
          find openwrt/build_dir openwrt/bin -type f \( -iname "*.dtb" -o -iname "*.dtb.o" \) 2>/dev/null
          echo ""
          # сначала пробуем узкий, более надёжный путь (типичное расположение
          # скомпилированных dtb для ath79/mips), и только если там пусто —
          # расширяем поиск на весь build_dir/bin
          DTB=$(find openwrt/build_dir -type f -path "*boot*dts*" \
            \( -iname "*.dtb" -o -iname "*.dtb.o" \) \
            2>/dev/null | grep -i "wdr4300" | head -n1)
          if [ -z "$DTB" ]; then
            echo "в типичном пути */boot*dts* ничего не нашлось, расширяю поиск на весь build_dir/bin:"
            DTB=$(find openwrt/build_dir openwrt/bin -type f \
              \( -iname "*.dtb" -o -iname "*.dtb.o" \) \
              2>/dev/null | grep -i "wdr4300" | head -n1)
          fi
          if [ -z "$DTB" ]; then
            echo "точного совпадения по wdr4300 нет, пробую более широкий поиск по ar9344 (может задеть соседние устройства платформы — mr18/db120/ap136 и т.п., поэтому это вторая попытка, а не первая):"
            DTB=$(find openwrt/build_dir openwrt/bin -type f \
              \( -iname "*.dtb" -o -iname "*.dtb.o" \) \
              2>/dev/null | grep -i "ar9344" | head -n1)
          fi
          if [ -n "$DTB" ]; then
            echo "Нашёл отдельный .dtb: $DTB"
            DTS=$(mktemp)
            # trap только на EXIT: он срабатывает и при обычном завершении, и при exit 1,
            # и при получении сигнала. Отдельные обработчики INT/TERM тут не нужны —
            # без явного exit внутри них скрипт бы просто продолжил выполнение после
            # сигнала вместо завершения, что на одноразовом раннере не имеет смысла.
            trap 'rm -f "$DTS"' EXIT
            dtc -I dtb -O dts "$DTB" > "$DTS" 2>/dev/null \
              || { echo "::error::dtc не смог декомпилировать $DTB — файл повреждён или не является валидным dtb"; exit 1; }
            test -s "$DTS" \
              || { echo "::error::dtc отработал без ошибки, но вывод пустой — $DTB, похоже, не тот файл"; exit 1; }
            echo "--- разделы из скомпилированного dtb ---"
            grep -A4 -B1 "partition@" "$DTS"
            grep -q "0xfd0000" "$DTS" \
              && echo "OK: увеличенный firmware-раздел (0xfd0000) найден в скомпилированном dtb" \
              || { echo "::error::в скомпилированном dtb нет 0xfd0000 — firmware-раздел не пропатчился"; exit 1; }
            grep -q "0xff0000\|partition@ff0000" "$DTS" \
              && echo "OK: сдвинутый art-раздел (0xff0000) найден в скомпилированном dtb" \
              || { echo "::error::в скомпилированном dtb нет 0xff0000/partition@ff0000 — art-раздел не сдвинулся"; exit 1; }
          else
            echo "Отдельного .dtb не найдено. Для ath79 это нормально: DTB может быть встроен в kernel и отсутствовать как отдельный файл."
            echo "fdtdump ниже выполняется только как дополнительная диагностика — TP-Link factory.bin почти никогда не является"
            echo "валидным FDT сам по себе, так что отсутствие результата здесь не признак проблемы, а ожидаемый исход."
            IMG=$(find openwrt/bin/targets/ath79/generic -iname "*wdr4300*factory*" | head -n1)
            if [ -z "$IMG" ]; then
              echo "не нашёл итоговый образ для этой попытки — не страшно, см. шаг 'Firmware size' ниже (справочно)"
            else
              fdtdump "$IMG" 2>/dev/null | grep -A4 -B1 "partition@" || true
            fi
          fi

      - name: Firmware size (informational only)
        run: |
          # ВАЖНО: это не проверка успеха/неудачи. Размер firmware-раздела в разметке
          # (16М) — это ПОТОЛОК, а не гарантированный итоговый размер файла: реальный
          # factory.bin/sysupgrade.bin определяется тем, сколько весят собранные kernel
          # и rootfs, и может остаться небольшим даже при полностью корректном патче
          # (например 8-9 МБ), если сама прошивка компактная. Рост размера НЕ доказывает
          # успех, а его отсутствие НЕ доказывает провал — единственный надёжный сигнал
          # выше это проверка разделов через dtc/фактическая загрузка на устройстве.
          echo "===== Firmware size (только для справки, ничего не проверяет) ====="
          test -d openwrt/bin/targets/ath79/generic \
            || { echo "::error::директория openwrt/bin/targets/ath79/generic не существует — сборка, похоже, не дошла до этого этапа"; exit 1; }
          find openwrt/bin/targets/ath79/generic -maxdepth 1 -iname "*.bin" -exec ls -lh {} \;
          echo ""
          echo "--- .manifest (список пакетов и их версий, если сгенерирован) ---"
          find openwrt/bin/targets/ath79/generic -maxdepth 1 -iname "*.manifest" -exec cat {} \; 2>/dev/null || echo "manifest не найден"
          echo ""
          echo "--- все файлы в targets/ath79/generic с размерами (что вообще собралось и сколько весит) ---"
          find openwrt/bin/targets/ath79/generic -maxdepth 1 -type f -exec ls -lh {} \;
          echo ""
          echo "===== Жёсткая проверка: не превышает ли образ размер firmware-раздела (0xfd0000 = 16 580 608 байт) ====="
          # это не круглые 16 МБ, а именно наш firmware-раздел после патча (16М минус
          # бутлоадер 0x20000 и art 0x10000) — образ больше этого физически не влезет
          find openwrt/bin/targets/ath79/generic -maxdepth 1 \( -iname "*factory*.bin" -o -iname "*sysupgrade*.bin" \) -print0 \
            | while IFS= read -r -d '' IMG; do
                SIZE=$(stat -c%s "$IMG")
                if [ "$SIZE" -gt 16580608 ]; then
                  echo "::error::$IMG весит $SIZE байт — больше, чем помещается в firmware-раздел (16580608 байт), такой образ не прошьётся"
                  echo "TOOBIG" >> /tmp/size_check_failed
                else
                  echo "OK: $IMG ($SIZE байт) помещается в firmware-раздел"
                fi
              done
          # | while создаёт subshell, поэтому exit внутри цикла не остановил бы этот шаг —
          # вместо этого цикл пишет маркер в файл, а проверяем и падаем уже здесь, снаружи
          if [ -f /tmp/size_check_failed ]; then
            rm -f /tmp/size_check_failed
            exit 1
          fi

      - name: Collect output images
        run: |
          mkdir -p out
          test -d openwrt/bin/targets/ath79/generic \
            || { echo "::error::директория с результатами сборки не существует — сборка не завершилась успешно"; exit 1; }
          echo "--- всё, что реально собралось в targets/ath79/generic (до фильтрации) ---"
          find openwrt/bin/targets/ath79/generic -maxdepth 1 -type f
          find openwrt/bin/targets/ath79/generic -maxdepth 1 -type f \
            \( -iname "*wdr4300*" -o -iname "*.bin" -o -iname "*.itb" \
               -o -iname "*.manifest" -o -iname "*.json" -o -iname "sha256sums" \) \
            -exec cp -v {} out/ \;
          # .config и feeds.conf.default — чтобы через полгода можно было понять,
          # с какими именно настройками собиралась эта прошивка
          cp -v openwrt/.config out/config.txt
          cp -v openwrt/feeds.conf.default out/feeds.conf.default
          echo "--- контрольные суммы итоговых образов ---"
          find out -maxdepth 1 -iname "*.bin" -exec sha256sum {} \; | tee out/sha256sums.txt
          echo "--- скопировано в out/ ---"
          ls -la out

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-wdr4300-16M-${{ github.run_number }}
          path: out/
          retention-days: 14

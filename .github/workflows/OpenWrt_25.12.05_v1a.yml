name: OpenWrt_25.12.05_v1a

on:
  workflow_dispatch:
    inputs:
      confirm_model:
        description: 'Подтверждение: физический роутер TL-WDR4300 v1'
        required: true
        default: 'TL-WDR4300 v1'
      include_python:
        description: 'Добавить Python3/PIP (увеличивает размер образа)'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev \
            curl rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler \
            u-boot-tools ccache

      - name: Verify selected hardware
        run: |
          MODEL="${{ github.event.inputs.confirm_model }}"
          if [ "$MODEL" != "TL-WDR4300 v1" ]; then
            echo "::error::Этот workflow предназначен только для физического TL-WDR4300 v1."
            exit 1
          fi

      - name: Clone OpenWrt 25.12.5
        run: |
          git clone --branch v25.12.5 --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          echo "HEAD:     $(git rev-parse HEAD)"
          echo "Describe: $(git describe --always --tags)"
          echo "Log:      $(git log -1 --oneline)"

      - name: Locate WDR4300 DTS and image definitions
        run: |
          set -e
          echo "===== WDR4300 DTS/DTSI ====="
          find openwrt/target/linux/ath79/dts \
            \( -iname "*wdr4300*" -o -iname "*wdrxxxx*" \) -print

          echo "===== Old firmware layout ====="
          grep -RIn "0x020000.*0x7d0000\|0x7d0000" \
            openwrt/target/linux/ath79/dts || true

          echo "===== Old ART ====="
          grep -RIn "partition@7f0000\|0x7f0000" \
            openwrt/target/linux/ath79/dts || true

          echo "===== WDR4300 v1 image profile ====="
          grep -RIn "define Device/tplink_tl-wdr4300-v1" \
            openwrt/target/linux/ath79/image || true

      - name: Patch WDR4300 v1 image type 8MB -> 16MB
        shell: bash
        run: |
          set -euo pipefail
          FILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"

          test -f "$FILE" || {
            echo "::error::Не найден $FILE"
            exit 1
          }

          echo "===== BEFORE ====="
          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE"

          sed -i \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/ s/\$(Device\/tplink-8mlzma)/\$(Device\/tplink-16mlzma)/' \
            "$FILE"

          echo "===== AFTER ====="
          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE"

          sed -n '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' "$FILE" |
            grep -q '\$(Device/tplink-16mlzma)' || {
              echo "::error::WDR4300 v1 не переведён на tplink-16mlzma"
              exit 1
            }

      - name: Patch WDR4300 flash layout to 16MB
        shell: bash
        run: |
          set -euo pipefail

          # На OpenWrt 25.12.5 WDR4300 используется общий DTSI.
          FILE=$(grep -RIlE '0x020000[[:space:]]+0x7d0000' \
            openwrt/target/linux/ath79/dts | head -n1 || true)

          if [ -z "$FILE" ]; then
            echo "::error::Не найден DTS/DTSI со старой 8MB разметкой."
            exit 1
          fi

          echo "Патчим: $FILE"

          # firmware: 0x020000 + 0xfd0000 = 0xff0000
          sed -i -E \
            's/0x020000[[:space:]]+0x7d0000/0x020000 0xfd0000/' "$FILE"

          # ART: 0x7f0000 -> 0xff0000, размер 0x10000
          sed -i 's/partition@7f0000/partition@ff0000/g' "$FILE"
          sed -i -E \
            's/0x7f0000[[:space:]]+0x010000/0xff0000 0x010000/' "$FILE"

          echo "===== PATCHED PARTITIONS ====="
          grep -nE \
            'partition@|firmware|art|0x020000|0xfd0000|0xff0000|0x010000' \
            "$FILE" || true

          grep -qE '0x020000[[:space:]]+0xfd0000' "$FILE" || {
            echo "::error::Firmware partition не переведён на 16MB"
            exit 1
          }

          grep -q 'partition@ff0000' "$FILE" || {
            echo "::error::ART partition не перемещён в 0xff0000"
            exit 1
          }

          grep -qE '0xff0000[[:space:]]+0x010000' "$FILE" || {
            echo "::error::ART size/offset неверны"
            exit 1
          }

      - name: Patch IMAGE_SIZE
        shell: bash
        run: |
          set -euo pipefail

          MKFILE=$(grep -Rl "tplink_tl-wdr4300-v1" \
            openwrt/target/linux/ath79/image | head -n1 || true)

          if [ -z "$MKFILE" ]; then
            echo "::error::Не найден image Makefile WDR4300"
            exit 1
          fi

          echo "Using: $MKFILE"
          grep -n "IMAGE_SIZE" "$MKFILE" || true

          sed -i -E \
            's/(IMAGE_SIZE[[:space:]]*:?=[[:space:]]*)[0-9]+k/\116128k/' \
            "$MKFILE"

          grep -q "16128k" "$MKFILE" || {
            echo "::error::IMAGE_SIZE != 16128k"
            exit 1
          }

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-
            openwrt-25.12.5-ath79-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          set -euo pipefail

          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y" >> .config

          # Build
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config

          # ==========================================================
          # РУССКИЙ ЯЗЫК / LUCi
          # ==========================================================
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_uhttpd=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-ru=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-opkg-ru=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-firewall-ru=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-material=y" >> .config

          # Русская локаль/локализация CLI
          echo "CONFIG_PACKAGE_zoneinfo-asia=y" >> .config
          echo "CONFIG_PACKAGE_libustream-openssl=y" >> .config

          # ==========================================================
          # USB / STORAGE
          # ==========================================================
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config
          echo "CONFIG_PACKAGE_kmod-scsi-core=y" >> .config
          echo "CONFIG_PACKAGE_kmod-scsi-generic=y" >> .config
          echo "CONFIG_PACKAGE_usbutils=y" >> .config

          # Filesystems
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-vfat=y" >> .config
          echo "CONFIG_PACKAGE_dosfstools=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config
          echo "CONFIG_PACKAGE_exfatprogs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y" >> .config
          echo "CONFIG_PACKAGE_ntfs3-mount=y" >> .config

          # extroot/block
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_blockd=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs-fsck=y" >> .config
          echo "CONFIG_PACKAGE_mount-utils=y" >> .config

          # ==========================================================
          # DREAME / PCAP / NETWORK ANALYSIS
          # ==========================================================
          echo "CONFIG_PACKAGE_tcpdump=y" >> .config
          echo "CONFIG_PACKAGE_tcpdump-mini=y" >> .config
          echo "CONFIG_PACKAGE_tshark=y" >> .config
          echo "CONFIG_PACKAGE_libpcap=y" >> .config
          echo "CONFIG_PACKAGE_bind-tools=y" >> .config
          echo "CONFIG_PACKAGE_drill=y" >> .config
          echo "CONFIG_PACKAGE_nmap-ssl=y" >> .config
          echo "CONFIG_PACKAGE_ca-certificates=y" >> .config
          echo "CONFIG_PACKAGE_openssl-util=y" >> .config

          # ==========================================================
          # NETWORK
          # ==========================================================
          echo "CONFIG_PACKAGE_ip-full=y" >> .config
          echo "CONFIG_PACKAGE_iproute2=y" >> .config
          echo "CONFIG_PACKAGE_kmod-netlink-diag=y" >> .config
          echo "CONFIG_PACKAGE_conntrack=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nf-conntrack=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y" >> .config
          echo "CONFIG_PACKAGE_iptables=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-conntrack=y" >> .config
          echo "CONFIG_PACKAGE_mtr=y" >> .config
          echo "CONFIG_PACKAGE_iperf3=y" >> .config
          echo "CONFIG_PACKAGE_ethtool=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config
          echo "CONFIG_PACKAGE_jq=y" >> .config

          # ==========================================================
          # VPN
          # ==========================================================
          echo "CONFIG_PACKAGE_openvpn-openssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openvpn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-openvpn-ru=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config

          echo "CONFIG_PACKAGE_wireguard-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-wireguard=y" >> .config
          echo "CONFIG_PACKAGE_kmod-wireguard=y" >> .config
          echo "CONFIG_WIREGUARD=y" >> .config
          echo "CONFIG_TUN=y" >> .config

          # ==========================================================
          # WIFI DIAGNOSTICS
          # ==========================================================
          echo "CONFIG_PACKAGE_iwinfo=y" >> .config
          echo "CONFIG_PACKAGE_iw=y" >> .config
          echo "CONFIG_PACKAGE_wireless-tools=y" >> .config

          # ==========================================================
          # SYSTEM DIAGNOSTICS
          # ==========================================================
          echo "CONFIG_PACKAGE_htop=y" >> .config
          echo "CONFIG_PACKAGE_procps-ng=y" >> .config
          echo "CONFIG_PACKAGE_lsof=y" >> .config
          echo "CONFIG_PACKAGE_file=y" >> .config
          echo "CONFIG_PACKAGE_findutils=y" >> .config
          echo "CONFIG_PACKAGE_coreutils=y" >> .config
          echo "CONFIG_PACKAGE_coreutils-timeout=y" >> .config

          # Editors / terminal
          echo "CONFIG_PACKAGE_nano=y" >> .config
          echo "CONFIG_PACKAGE_vim-full=y" >> .config
          echo "CONFIG_PACKAGE_screen=y" >> .config
          echo "CONFIG_PACKAGE_tmux=y" >> .config

          # Logging
          echo "CONFIG_PACKAGE_logrotate=y" >> .config

          # ==========================================================
          # SSH / FILE TRANSFER
          # ==========================================================
          echo "CONFIG_PACKAGE_dropbear=y" >> .config
          echo "CONFIG_PACKAGE_openssh-client=y" >> .config
          echo "CONFIG_PACKAGE_openssh-sftp-client=y" >> .config
          echo "CONFIG_PACKAGE_rsync=y" >> .config
          echo "CONFIG_PACKAGE_sftp-server=y" >> .config

          # Disk monitoring
          echo "CONFIG_PACKAGE_smartmontools=y" >> .config

          # Kernel diagnostics
          echo "CONFIG_NETLINK_DIAG=y" >> .config
          echo "CONFIG_INET_DIAG=y" >> .config
          echo "CONFIG_INET_TCP_DIAG=y" >> .config
          echo "CONFIG_INET_UDP_DIAG=y" >> .config

          # Optional Python
          if [ "${{ github.event.inputs.include_python }}" = "true" ]; then
            echo "CONFIG_PACKAGE_python3=y" >> .config
            echo "CONFIG_PACKAGE_python3-pip=y" >> .config
            echo "CONFIG_PACKAGE_python3-asyncio=y" >> .config
            echo "CONFIG_PACKAGE_python3-json=y" >> .config
          fi

          make defconfig

          echo "===== TARGET ====="
          grep "^CONFIG_TARGET_" .config | grep -E "BOARD|SUBTARGET|PROFILE|DEVICE_" || true

          echo "===== RUSSIAN LUCi ====="
          grep "^CONFIG_PACKAGE_luci.*-ru=y" .config || true

          echo "===== VPN ====="
          grep -E "^CONFIG_PACKAGE_(openvpn-openssl|kmod-tun|wireguard-tools|kmod-wireguard|luci-proto-wireguard)=y" .config || true

          echo "===== STORAGE ====="
          grep -E "^CONFIG_PACKAGE_(kmod-usb-storage|kmod-fs-ext4|kmod-fs-vfat|kmod-fs-exfat|kmod-fs-ntfs3|block-mount)=y" .config || true

          grep -q "^CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y$" .config || {
            echo "::error::После defconfig выбран не TL-WDR4300 v1"
            exit 1
          }

          make download -j"$(nproc)"

      - name: Prepare ccache
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --zero-stats
          ccache -s

      - name: Download sources and validate archives
        working-directory: openwrt
        run: |
          set -e
          make download -j"$(nproc)" V=s
          BAD=$(find dl -type f -size -1024c)
          if [ -n "$BAD" ]; then
            echo "::error::Обнаружены подозрительно маленькие/повреждённые архивы:"
            echo "$BAD"
            exit 1
          fi

      - name: Build firmware
        working-directory: openwrt
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          make -j"$(nproc)" V=sc || make -j1 V=sc

      - name: Show ccache statistics
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ccache -s || true

      - name: Verify final DTB and partition layout
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SEARCH DTB ====="

          DTB=$(
              find openwrt/build_dir openwrt/bin \
                -type f \
                \( -iname "*.dtb" -o -iname "*.dtb.o" \) |
              grep -Ei 'wdr4300|tplink' |
              head -n1
          )          

          if [ -z "$DTB" ]; then
            echo "::error::Итоговый DTB WDR4300 не найден."
            exit 1
          fi

          echo "DTB: $DTB"
          DTS=$(mktemp)
          trap 'rm -f "$DTS"' EXIT
          dtc -I dtb -O dts "$DTB" > "$DTS"

          echo "===== PARTITIONS ====="
          grep -A5 -B1 "partition@" "$DTS"

          # Строгая проверка firmware
          grep -Eq 'partition@20000' "$DTS" || {
            echo "::error::Firmware partition@20000 не найден."
            exit 1
          }

          grep -Eq 'reg = <0x20000 0xfd0000>' "$DTS" || {
            echo "::error::Firmware reg не равен <0x20000 0xfd0000>."
            exit 1
          }

          # Строгая проверка ART
          grep -Eq 'partition@ff0000' "$DTS" || {
            echo "::error::ART partition@ff0000 не найден."
            exit 1
          }

          grep -Eq 'reg = <0xff0000 0x10000>' "$DTS" || {
            echo "::error::ART reg не равен <0xff0000 0x10000>."
            exit 1
          }

          echo "===== DTB LAYOUT CHECK: PASS ====="

      - name: Verify firmware image size
        shell: bash
        run: |
          set -euo pipefail

          DIR="openwrt/bin/targets/ath79/generic"
          LIMIT=16580608

          test -d "$DIR" || {
            echo "::error::Каталог firmware не найден: $DIR"
            exit 1
          }

          echo "===== FIRMWARE IMAGES ====="
          ls -lh "$DIR"/*.bin

          COUNT=0
          while IFS= read -r IMG; do
            [ -z "$IMG" ] && continue
            COUNT=$((COUNT + 1))
            SIZE=$(stat -c%s "$IMG")
            echo "$IMG -> $SIZE bytes"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$IMG больше 16MB firmware partition ($LIMIT bytes)"
              exit 1
            fi
          done < <(
            find "$DIR" -maxdepth 1 -type f \
              \( -iname "*factory*.bin" -o -iname "*sysupgrade*.bin" \)
          )

          [ "$COUNT" -gt 0 ] || {
            echo "::error::Factory/sysupgrade BIN не найден."
            exit 1
          }

          echo "===== IMAGE SIZE CHECK: PASS ====="

      - name: Verify required files and package configuration
        working-directory: openwrt
        run: |
          set -e

          echo "===== REQUIRED CONFIG ====="
          REQUIRED=(
            "CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wdr4300-v1=y"
            "CONFIG_PACKAGE_luci=y"
            "CONFIG_PACKAGE_luci-i18n-base-ru=y"
            "CONFIG_PACKAGE_luci-i18n-firewall-ru=y"
            "CONFIG_PACKAGE_openvpn-openssl=y"
            "CONFIG_PACKAGE_kmod-tun=y"
            "CONFIG_PACKAGE_wireguard-tools=y"
            "CONFIG_PACKAGE_kmod-wireguard=y"
            "CONFIG_PACKAGE_tcpdump=y"
            "CONFIG_PACKAGE_tshark=y"
            "CONFIG_PACKAGE_kmod-usb-storage=y"
            "CONFIG_PACKAGE_kmod-fs-ext4=y"
            "CONFIG_PACKAGE_block-mount=y"
          )

          for item in "${REQUIRED[@]}"; do
            grep -qx "$item" .config || {
              echo "::error::Отсутствует обязательная настройка: $item"
              exit 1
            }
          done

          echo "===== REQUIRED CONFIG CHECK: PASS ====="

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          cp openwrt/bin/targets/ath79/generic/* out/ 2>/dev/null || true
          cp openwrt/.config out/config.txt
          cp openwrt/feeds.conf.default out/

          {
            echo "OpenWrt 25.12.5"
            echo "Target: ath79/generic"
            echo "Device: TL-WDR4300 v1"
            echo "Flash: 16 MB"
            echo "Firmware partition: 0x020000 + 0xfd0000"
            echo "ART partition: 0xff0000 + 0x010000"
            echo "LuCI language: Russian"
            echo "Build: 1a"
            echo
            echo "Git HEAD:"
            git -C openwrt rev-parse HEAD
          } > out/BUILD_INFO.txt

          find out -type f -exec sha256sum {} + > out/sha256sums.txt

          echo "===== OUTPUT ====="
          ls -lah out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_25.12.05_v1a-${{ github.run_number }}
          path: out/
          retention-days: 30

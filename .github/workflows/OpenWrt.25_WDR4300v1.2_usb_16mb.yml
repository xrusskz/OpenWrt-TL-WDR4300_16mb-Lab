name: OpenWrt.25_WDR4300v1.2_usb_16mb
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-dev \
            curl rsync swig unzip zlib1g-dev \
            file wget device-tree-compiler \
            u-boot-tools ccache
          echo "========== Compiler versions =========="
          gcc --version | head -n1
          clang --version | head -n1
          ccache --version | head -n1
          echo "======================================="
      - name: Clone OpenWrt 25.12.5 source
        run: |
          set -euo pipefail
          git clone --branch v25.12.5 --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          HEAD="$(git rev-parse HEAD)"
          echo "HEAD:     $(git rev-parse HEAD)"
          echo "Describe: $(git describe --always --tags)"
          echo "Log:      $(git log -1 --oneline)"
          case "$HEAD" in
            f0a60ee*) ;;
            *) echo "::error::Получен не OpenWrt v25.12.5 commit f0a60ee."; exit 1 ;;
          esac
      - name: Locate DTS/DTSI files
        run: |
          set -euo pipefail
          echo "===== WDR files ====="
          find openwrt/target/linux/ath79/dts \
            \( \
            -iname "*wdr4300*" \
            -o -iname "*wdr3600*" \
            -o -iname "*wdrxxxx*" \
            \)
          echo "===== Search firmware layout ====="
          grep -RIn "7d0000" openwrt/target/linux/ath79/dts || true
          echo
          echo "===== Search old ART partition ====="
          grep -RIn "partition@7f0000" \
            openwrt/target/linux/ath79/dts || true
          echo
          echo "===== Search image definitions ====="
          grep -RIn "tplink_tl-wdr4300" \
            openwrt/target/linux/ath79/image || true
      #####################################################################
      ## PATCH IMAGE TYPE: 8MB -> 16MB
      #####################################################################
      - name: Change WDR4300 v1 image type to 16MB
        shell: bash
        run: |
          set -euo pipefail
          FILE="openwrt/target/linux/ath79/image/generic-tp-link.mk"
          echo "Using:"
          echo "$FILE"
          if [ ! -f "$FILE" ]; then
            echo "::error::File not found: $FILE"
            exit 1
          fi
          echo
          echo "===== BEFORE ====="
          sed -n \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' \
            "$FILE"
          echo
          echo "===== PATCHING WDR4300 v1 ONLY ====="
          sed -i \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/ s/\$(Device\/tplink-8mlzma)/\$(Device\/tplink-16mlzma)/' \
            "$FILE"
          echo
          echo "===== AFTER ====="
          sed -n \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' \
            "$FILE"
          echo
          echo "===== VERIFY ====="
          if sed -n \
            '/define Device\/tplink_tl-wdr4300-v1$/,/^endef$/p' \
            "$FILE" | grep -q '\$(Device/tplink-16mlzma)'; then
            echo "WDR4300 v1 successfully changed to 16mlzma"
          else
            echo "::error::WDR4300 v1 was not changed to 16mlzma"
            exit 1
          fi
          echo
          echo "===== 16MB IMAGE TYPE PATCH SUCCESS ====="
      ####################################################################
      ## PATCH FLASH LAYOUT
      ####################################################################
      - name: Patch flash layout to 16MB
        run: |
          set -euo pipefail
          echo "Using WDR4300 DTSI"
          FILE="openwrt/target/linux/ath79/dts/ar9344_tplink_tl-wdrxxxx.dtsi"
          if [ ! -f "$FILE" ]; then
              echo "::error::Не найден $FILE"
              exit 1
          fi
          echo
          echo "===== FILE CONTENT ====="
          sed -n '1,220p' "$FILE"
          echo
          echo "===== SEARCH PARTITIONS ====="
          grep -nE "partition|firmware|art|0x020000|0x7d0000|0x7f0000" "$FILE" || true
          echo
          echo "===== PATCHING ====="
          sed -i -E \
            's/0x020000[[:space:]]+0x7d0000/0x020000 0xfd0000/' \
            "$FILE"
          sed -i \
            's/partition@7f0000/partition@ff0000/' \
            "$FILE"
          sed -i -E \
            's/0x7f0000[[:space:]]+0x010000/0xff0000 0x010000/' \
            "$FILE"
          echo
          echo "===== AFTER PATCH ====="
          grep -nE "partition|firmware|art|0xfd0000|0xff0000" "$FILE" || true
          echo
          echo "===== VERIFY PATCH ====="
          grep -q "0x020000 0xfd0000" "$FILE" || {
              echo "::error::Firmware partition не изменён"
              exit 1
          }
          grep -q "partition@ff0000" "$FILE" || {
              echo "::error::ART partition не перемещён"
              exit 1
          }
          grep -q "0xff0000 0x010000" "$FILE" || {
              echo "::error::ART offset не изменён"
              exit 1
          }
          echo
          echo "===== PATCH SUCCESS ====="
           # tplink-16mlzma задаёт IMAGE_SIZE=16192k в common-tp-link.mk.
           # Глобальная замена IMAGE_SIZE здесь не выполняется.
      - name: Detect device profile name
        run: |
          set -euo pipefail
          CANDIDATES=$(
            grep -RhoE "define Device/tplink_tl-wdr4300[a-zA-Z0-9_-]*" \
              openwrt/target/linux/ath79/image \
              | sed 's#define Device/##' \
              | sort -u
          )
          echo "Найдены профили:"
          echo "$CANDIDATES"
          if [ -z "$CANDIDATES" ]; then
              echo "::error::Не найден профиль TL-WDR4300"
              exit 1
          fi
           PROFILE=$(echo "$CANDIDATES" | grep -x "tplink_tl-wdr4300-v1" || true)
           [ -n "$PROFILE" ] || {
               echo "::error::Профиль tplink_tl-wdr4300-v1 не найден."
               exit 1
           }
          echo "Выбран профиль:"
          echo "$PROFILE"
          echo "DEVICE_PROFILE=$PROFILE" >> "$GITHUB_ENV"
      ####################################################################
      ## CACHE
      ####################################################################
      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-dl
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-
            openwrt-25.12.5-ath79-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
          restore-keys: |
            openwrt-25.12.5-ath79-${{ runner.os }}-${{ runner.arch }}-ccache
      ####################################################################
      ## FEEDS
      ####################################################################
      - name: Update feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      ####################################################################
      ## CONFIG
      ####################################################################
      - name: Configure build
        working-directory: openwrt
        run: |
          set -euo pipefail
          test -n "$DEVICE_PROFILE" || {
            echo "::error::DEVICE_PROFILE пуст"
            exit 1
          }
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_${DEVICE_PROFILE}=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          # ==========================================================
          # BUILD OPTIONS
          # ==========================================================
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          # ==========================================================
          # LUCI WEB INTERFACE
          # ==========================================================

          # Русская локаль/локализация CLI
          # ==========================================================
          # USB STORAGE
          # ==========================================================
 
          # ==========================================================
          # FILESYSTEMS
          # EXT4 / FAT32
          # ==========================================================
          # ==========================================================
          # EXTROOT / BLOCK MANAGEMENT
          # ==========================================================
          # ==========================================================
          # DREAME TRAFFIC ANALYSIS
          # ==========================================================
          # ==========================================================
          # CONNECTION TRACKING / FIREWALL
          # ==========================================================
          # ==========================================================
          # NETWORK TOOLS
          # ==========================================================
          # ==========================================================
          # VPN
          # OpenVPN + WireGuard
          # ==========================================================
          echo "CONFIG_PACKAGE_openvpn-openssl=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ovpn-backports=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          # ==========================================================
          # WIFI DIAGNOSTICS
          # ==========================================================
          # ==========================================================
          # SYSTEM DIAGNOSTICS
          # ==========================================================
          # ==========================================================
          # EDITORS / TERMINAL
          # ==========================================================
          # ==========================================================
          # LOGGING
          # ==========================================================
          # ==========================================================
          # SSH / FILE TRANSFER
          # ==========================================================
          # ==========================================================
          # DISK MONITORING
          # ==========================================================
          # Kernel diagnostics
          # ==========================================================
          # GENERATE FINAL CONFIG
          # ==========================================================
          make defconfig
          echo
          echo "========== TARGET =========="
          grep "^CONFIG_TARGET_BOARD=" .config || true
          grep "^CONFIG_TARGET_SUBTARGET=" .config || true
          grep "^CONFIG_TARGET_PROFILE=" .config || true
          grep "^CONFIG_TARGET_MULTI_PROFILE=" .config || true
          grep "^CONFIG_TARGET_ath79_generic_DEVICE_" .config || true
          echo
          echo "========== CORE PACKAGES =========="
           grep "^CONFIG_PACKAGE_openvpn-openssl=y" .config || true
           grep "^CONFIG_PACKAGE_kmod-ovpn-backports=y" .config || true
           grep "^CONFIG_PACKAGE_kmod-tun=y" .config || true
          echo
          echo "========== STORAGE =========="
          echo
          echo "========== BUILD OPTIONS =========="
          grep "^CONFIG_CCACHE=y" .config || true
          grep -q "CONFIG_TARGET_ath79_generic_DEVICE_${DEVICE_PROFILE}=y" .config || {
              echo "::error::Профиль устройства исчез после defconfig"
              exit 1
          }
          make -j$(nproc) download
      #####################################################################
      ## PREPARE CCACHE
      #####################################################################
      - name: Prepare ccache
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail
          ccache --set-config=max_size=5G
          ccache --zero-stats
          ccache -s
      #####################################################################
      ## CHECK CONFIG
      #####################################################################
      - name: Check kernel packages
        working-directory: openwrt
        run: |
          set -euo pipefail
           grep CONFIG_PACKAGE_openvpn-openssl .config
           grep CONFIG_PACKAGE_kmod-ovpn-backports .config
           grep CONFIG_PACKAGE_kmod-tun .config
      #####################################################################
      ## DOWNLOAD SOURCES
      #####################################################################
      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)" V=s
          
          BAD=$(find dl -type f -size -1024c)

          if [ -n "$BAD" ]; then
              echo "::error::Обнаружены поврежденные архивы"
              echo "$BAD"
              exit 1
          fi
      #####################################################################
      ## BUILD
      #####################################################################
      - name: Build firmware
        working-directory: openwrt
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=sc || make -j1 V=sc

      #####################################################################
      ## CCACHE STATISTICS
      #####################################################################
      - name: Show ccache statistics
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          ccache -s || true
      ####################################################################
      ## VERIFY DTB
      ####################################################################
      - name: Verify patched layout
        run: |
          set -euo pipefail
          echo "===== Searching WDR4300 DTB ====="
          DTB=$(
            find openwrt/build_dir openwrt/bin \
              -type f \
              \( -iname "*.dtb" -o -iname "*.dtb.o" \) \
              2>/dev/null \
            | grep -i "$DEVICE_PROFILE" \
            | head -n1
          )
          if [ -z "$DTB" ]; then
              DTB=$(
                find openwrt/build_dir openwrt/bin \
                  -type f \
                  \( -iname "*.dtb" -o -iname "*.dtb.o" \) \
                  2>/dev/null \
                | grep -i "tplink" \
                | grep -i "4300" \
                | head -n1
              )
          fi
           if [ -z "$DTB" ]; then
               echo "::error::Standalone TL-WDR4300 DTB not found."
               exit 1
           fi
           echo "Found:"
           echo "$DTB"
           DTS=$(mktemp)
           trap 'rm -f "$DTS"' EXIT
           dtc -I dtb -O dts "$DTB" > "$DTS"
           grep -Eq 'tplink,tl-wdr4300-v1|TL-WDR4300 v1|TL-WDR4300' "$DTS" || {
               echo "::error::DTB не идентифицирован как TL-WDR4300 v1"
               exit 1
           }
           grep -q "partition@ff0000" "$DTS" || {
               echo "::error::ART partition not moved"
               exit 1
           }
           grep -Eq 'reg = <0xff0000 0x10000>|reg = <0x0*ff0000 0x0*10000>' "$DTS" || {
               echo "::error::ART offset wrong"
               exit 1
           }
           grep -Eq 'reg = <0x20000 0xfd0000>|reg = <0x0*20000 0x0*fd0000>' "$DTS" || {
               echo "::error::Firmware partition layout wrong"
               exit 1
           }
      ####################################################################
      ## SIZE CHECK
      ####################################################################
      - name: Verify image size
        run: |
          set -euo pipefail
          echo "===== Firmware ====="
          ls -lh openwrt/bin/targets/ath79/generic/*.bin || true
          LIMIT=16580608
          FAILED=0
          while read IMG; do
              [ -z "$IMG" ] && continue
              SIZE=$(stat -c%s "$IMG")
              echo
              echo "$IMG"
              echo "$SIZE bytes"
              if [ "$SIZE" -gt "$LIMIT" ]; then
                  echo "::error::Image is larger than firmware partition."
                  FAILED=1
              fi
           done < <(
              find openwrt/bin/targets/ath79/generic \
                -maxdepth 1 \
                \( \
                  -iname "*factory*.bin" \
                  -o \
                  -iname "*sysupgrade*.bin" \
                \)
           )
           test -n "$(find openwrt/bin/targets/ath79/generic -maxdepth 1 -type f -iname '*factory*.bin' -print -quit)" || {
               echo "::error::Factory image не найден"
               exit 1
           }
           test -n "$(find openwrt/bin/targets/ath79/generic -maxdepth 1 -type f -iname '*sysupgrade*.bin' -print -quit)" || {
               echo "::error::Sysupgrade image не найден"
               exit 1
           }
          [ "$FAILED" -eq 0 ] || exit 1
      ####################################################################
      ## COLLECT
      ####################################################################
      - name: Collect output
        run: |
          set -euo pipefail
          mkdir -p out
          cp openwrt/bin/targets/ath79/generic/* out/
          cp openwrt/.config out/config.txt
          cp openwrt/feeds.conf.default out/
          find out -maxdepth 1 -type f -iname '*factory*.bin' -print -quit | grep -q .
          find out -maxdepth 1 -type f -iname '*sysupgrade*.bin' -print -quit | grep -q .
          find out -type f -exec sha256sum {} + > out/sha256sums.txt
          echo
          echo "===== OUTPUT ====="
          ls -lah out
      ####################################################################
      ## UPLOAD
      ####################################################################
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt.25_WDR4300v1.2_usb_16mb-${{ github.run_number }}
          path: out/
          retention-days: 14
